<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3b2a1e">
<title>냠냠 식당</title>
<style>
:root{--ink:#3b2a1e;--sub:#8a7060;--accent:#ff7a45;--accent2:#ffb347;--line:#f0dcc6;--panel:#fffaf3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;background:#4a5d3a;overflow:hidden;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:fixed;inset:0}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:inherit;border:none;cursor:pointer;color:var(--ink)}
#title{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(circle at 50% 30%,#ffe3c2,#fff4e6 70%);text-align:center;padding:24px}
h1{margin:0;font-size:38px;letter-spacing:-1px}
.tsub{color:var(--sub);font-size:13px;line-height:1.6}
#nameIn,.tin{width:220px;padding:11px 14px;border-radius:14px;border:2px solid var(--line);font-size:16px;text-align:center;font-family:inherit;background:#fff;color:var(--ink);outline:none;user-select:text;-webkit-user-select:text}
.big{width:220px;padding:15px;border-radius:16px;font-size:19px;font-weight:800;background:var(--accent);color:#fff!important;box-shadow:0 5px 0 #d9541f}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #d9541f}
.big:disabled{opacity:.7}
.ghost{width:220px;padding:12px;border-radius:14px;font-size:16px;font-weight:700;background:#fff;border:2px solid var(--line)}
#netState{font-size:12px;color:var(--sub)}
#hud{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(8px + env(safe-area-inset-top)) 70px 6px 10px;pointer-events:none}
.hcard{background:#fffaf3ee;border-radius:14px;padding:7px 10px;box-shadow:0 3px 0 #0002}
.row1{display:flex;justify-content:space-between;align-items:center;font-weight:900}
#money{font-size:19px}
#lvl{font-size:12px;font-weight:900;background:#ffe066;color:#3b2a1e;border-radius:8px;padding:2px 6px;vertical-align:3px}
.lvbar{height:4px;background:#eadfd3;border-radius:3px;margin-top:4px;overflow:hidden}
.lvbar i{display:block;height:100%;background:#fab005;width:0}#money.neg{color:#e03131}
#clock{font-size:13px}
.repwrap{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;margin-top:4px}
.repbar{flex:1;height:10px;background:#eadfd3;border-radius:6px;overflow:hidden}
#repFill{height:100%;width:50%;background:#2fb344;transition:width .3s,background .3s}
.danger .repbar{animation:pulse .6s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 3px #ff6b6b88}}
#peak{margin-top:5px;padding:4px;border-radius:9px;text-align:center;font-weight:900;font-size:12px;background:linear-gradient(90deg,#ff6b6b,#ffa94d);color:#fff}
#info{font-size:11px;font-weight:800;color:var(--sub);margin-top:4px}
#info b{color:#e03131}
#tickets{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.tk{background:#fff;border-radius:8px;padding:3px 6px;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 2px 0 #0002}
.tk i{font-style:normal;color:var(--sub);margin-left:3px}
.tk.cook{background:#fff3bf}.tk.done{background:#d3f9d8}
#tutBar{position:absolute;left:10px;right:74px;top:calc(150px + env(safe-area-inset-top));z-index:7;background:#3b2a1ef0;color:#fff;border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:800;line-height:1.45;box-shadow:0 4px 0 #0003}
#tutBar #tutText{flex:1}
#tutSkip{background:#ffffff26;color:#fff!important;border-radius:9px;padding:6px 9px;font-size:11px;font-weight:800;white-space:nowrap}
#sideBtns{position:absolute;right:8px;top:calc(8px + env(safe-area-inset-top));z-index:6;display:flex;flex-direction:column;gap:6px}
#sideBtns button{width:58px;padding:11px 0;border-radius:14px;font-weight:900;font-size:13px;color:#fff;box-shadow:0 3px 0 #0003}
#bEdit{background:#2fb344}#bStaff{background:#1c7ed6}#bShop{background:#ff7a45}#bRank{background:#e8a800}#bPause{background:#495057}
#bDrop{border:2px solid #e03131;color:#e03131!important}
#controls{position:absolute;left:0;right:0;bottom:0;height:240px;z-index:6;pointer-events:none}
#joy{position:absolute;left:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:128px;height:128px;border-radius:50%;background:#ffffff40;border:3px solid #ffffffa0;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:37px;top:37px;width:54px;height:54px;border-radius:50%;background:#fffaf3;box-shadow:0 3px 0 #0003}
#bAct{position:absolute;right:18px;bottom:calc(32px + env(safe-area-inset-bottom));width:108px;height:108px;border-radius:50%;background:var(--accent);color:#fff;font-weight:900;font-size:15px;box-shadow:0 5px 0 #c4541f;pointer-events:auto;padding:10px;line-height:1.2;word-break:keep-all}
#bAct.off{background:#b9a99a!important;box-shadow:0 5px 0 #8f8073!important;font-size:13px}
#bAct small,#bAct2 small{display:block;font-size:10px;opacity:.85;margin-bottom:2px;letter-spacing:1px}
#bAct2::after{content:'2';position:absolute;top:-4px;right:-4px;width:22px;height:22px;border-radius:50%;background:#fff;color:#3b2a1e;font-size:12px;line-height:22px;box-shadow:0 2px 0 #0003}
#bAct:active{transform:translateY(3px)}
#bAct2{position:absolute;right:136px;bottom:calc(96px + env(safe-area-inset-bottom));width:86px;height:86px;border-radius:50%;background:#4dabf7;color:#fff;font-weight:900;font-size:13px;box-shadow:0 5px 0 #1c7ed6;pointer-events:auto;padding:8px;line-height:1.2;word-break:keep-all}
#bAct2:active{transform:translateY(3px)}
#controls.lefty #joy{left:auto;right:20px}#controls.lefty #bAct{right:auto;left:18px}#controls.lefty #bAct2,#controls.lefty #bDrop{right:auto;left:136px}#controls.lefty #carryInfo{right:auto;left:14px;text-align:left}
#bDrop{position:absolute;right:136px;bottom:calc(36px + env(safe-area-inset-bottom));padding:10px 12px;border-radius:12px;background:#fffaf3;font-weight:800;font-size:13px;pointer-events:auto;box-shadow:0 3px 0 #0002}
#carryInfo{position:absolute;right:14px;bottom:calc(192px + env(safe-area-inset-bottom));background:#fffaf3ee;border-radius:10px;padding:5px 9px;font-size:12px;font-weight:800;max-width:230px;text-align:right}
#carryInfo:empty{display:none}
#mgWrap{position:absolute;inset:0;z-index:15;background:#0005;display:flex;flex-direction:column;align-items:center;justify-content:center}
#mgBox{background:#fff4e6;border-radius:24px;padding:10px;display:flex;flex-direction:column;align-items:center;box-shadow:0 8px 30px #0005}
#mgTitle{font-weight:900;font-size:16px;margin:2px 0 6px;text-align:center}
#mg{background:#fffaf3;border-radius:18px;touch-action:none}
#mgHint{font-size:13px;font-weight:800;color:var(--sub);margin-top:6px;text-align:center}
#editBar{position:absolute;left:0;right:0;bottom:0;z-index:12;background:var(--panel);border-radius:20px 20px 0 0;box-shadow:0 -4px 20px #0003;max-height:48%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#editTop{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px;gap:8px}
#editTop b{font-size:16px}
#editTop span{font-size:12px;color:var(--sub);font-weight:700;flex:1}
#editBody{overflow:auto;padding:0 12px 14px}
.ebtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.eb{padding:9px 12px;border-radius:11px;background:#f3e7da;font-weight:800;font-size:13px}
.eb.pri{background:var(--accent);color:#fff}
.eb.on{background:var(--accent);color:#fff}
.eb:disabled{opacity:.45}
.tabs{display:flex;gap:5px;margin-bottom:8px}
.tabs button{flex:1;padding:8px 0;border-radius:11px;font-weight:800;font-size:13px;background:#f6ebdf;color:var(--sub)}
.tabs button.on{background:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cell{background:#fff;border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;font-weight:800}
.cell canvas{display:block;margin:0 auto 4px;width:44px;height:44px}
.cell small{display:block;color:var(--sub);font-weight:700}
.cell.dis{opacity:.45}
.swatches{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #0003}
.sw.on{box-shadow:0 0 0 3px var(--accent)}
.lbl{font-size:13px;font-weight:900;margin:8px 0 2px}
.note{font-size:12px;color:var(--sub);font-weight:700;margin:4px 0}
.warn{color:#e03131}
#modal{position:absolute;inset:0;z-index:20;background:#0007;display:flex;align-items:center;justify-content:center;padding:14px}
.panel{background:#fff;width:100%;max-width:460px;max-height:90%;border-radius:22px;display:flex;flex-direction:column;overflow:hidden}
.ph{padding:14px 16px 6px;display:flex;align-items:center;justify-content:space-between}
.ph h2{margin:0;font-size:21px}
.x{background:#f3e7da;width:36px;height:36px;border-radius:50%;font-size:16px;font-weight:900}
.pb{overflow:auto;padding:4px 12px 16px;display:flex;flex-direction:column;gap:8px}
.ptabs{display:flex;gap:6px;padding:0 12px 6px}
.ptabs button{flex:1;padding:8px;border-radius:11px;font-weight:800;font-size:14px;background:#f6ebdf;color:var(--sub)}
.ptabs button.on{background:var(--accent);color:#fff}
.item{display:flex;align-items:center;gap:10px;background:#fff8f0;border-radius:14px;padding:10px}
.item .info{flex:1;min-width:0}
.item .nm{font-weight:900;font-size:15px}
.item .ds{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.4}
.item canvas{width:44px;height:44px;flex:none}
.buy{padding:9px 10px;border-radius:12px;font-weight:900;font-size:13px;background:var(--accent);color:#fff;white-space:nowrap;min-width:82px}
.buy:disabled{background:#e6d8ca;color:#a9927d}
.buy.own{background:#d3f9d8;color:#2b8a3e}
.staff{background:#fff8f0;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:7px}
.staff.focus{outline:3px solid var(--accent2)}
.srow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13px;font-weight:700}
.dotc{width:16px;height:16px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px #fff,0 0 0 3px #0002}
.stp{display:inline-flex;align-items:center;gap:4px}
.stp button{width:30px;height:30px;border-radius:9px;background:#f3e7da;font-weight:900;font-size:16px}
.jobs{display:flex;gap:4px;flex-wrap:wrap}
.jobs button{padding:6px 9px;border-radius:9px;background:#f3e7da;font-size:12px;font-weight:800}
.jobs button.on{background:var(--accent);color:#fff}
.mood{flex:1;height:8px;background:#eadfd3;border-radius:5px;overflow:hidden;min-width:70px}
.mood i{display:block;height:100%}
.rk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#fff8f0;font-weight:800}
.rk.me{background:#ffe8cc;outline:2px solid var(--accent2)}
.rk .n{width:26px;text-align:center}
.rk .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .sc{font-size:14px}
.rk .dy{font-size:11px;color:var(--sub);width:44px;text-align:right}
.center{text-align:center;padding:10px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.stat{font-size:15px;line-height:1.7}
#speech{position:absolute;left:16px;right:16px;bottom:calc(250px + env(safe-area-inset-bottom));z-index:8;background:#fff;border-radius:16px;padding:10px 14px;font-size:14px;font-weight:700;box-shadow:0 4px 0 #0003;pointer-events:none;line-height:1.5}
#speech b{display:block;color:#f06595;font-size:12px}
#toasts{position:absolute;left:0;right:0;top:40%;z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
.toast{background:#3b2a1eee;color:#fff;padding:8px 14px;border-radius:12px;font-weight:800;font-size:13px;text-align:center;animation:tin .25s,tout .4s 2.1s forwards}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
</style>
</head>
<body>
<div id="app">
  <canvas id="world"></canvas>

  <div id="title">
    <canvas id="logo" width="240" height="200" style="width:120px;height:100px"></canvas>
    <h1>냠냠 식당</h1>
    <div class="tsub">가게를 직접 꾸미고, 손님을 안내하고, 요리는 미니게임으로!</div>
    <input id="nameIn" maxlength="10" placeholder="닉네임">
    <div id="saveInfo" class="tsub"></div>
    <button class="big" id="startBtn">영업 시작</button>
    <button class="ghost hidden" id="newBtn">처음부터 새로 시작</button>
    <button class="ghost" id="titleRank">랭킹</button>
    <div id="netState"></div>
    <div class="tsub" style="font-size:12px">왼쪽 조이스틱으로 이동 · 오른쪽 버튼으로 행동<br>PC: WASD/방향키 이동, 스페이스·Q 행동</div>
  </div>

  <div id="hud" class="hidden">
    <div class="hcard">
      <div class="row1"><div><span id="money"></span> <span id="lvl"></span></div><div id="clock"></div></div><div class="lvbar"><i id="lvFill"></i></div>
      <div class="repwrap" id="repWrap">평판 <div class="repbar"><div id="repFill"></div></div><b id="repNum"></b></div>
      <div id="peak" class="hidden">피크타임 · 팁 2배</div>
      <div id="info"></div>
      <div id="tickets"></div>
    </div>
  </div>

  <div id="tutBar" class="hidden"><div id="tutText"></div><button id="tutSkip">건너뛰기</button></div>

  <div id="sideBtns" class="hidden">
    <button id="bEdit">배치</button>
    <button id="bStaff">직원</button>
    <button id="bShop">상점</button>
    <button id="bRank">랭킹</button>
    <button id="bPause">메뉴</button>
  </div>

  <div id="controls" class="hidden">
    <div id="joy"><div id="knob"></div></div>
    <div id="carryInfo"></div>
    <button id="bAct2" class="hidden">-</button>
    <button id="bDrop" class="hidden">버리기</button>
    <button id="bAct" class="off">-</button>
  </div>

  <div id="editBar" class="hidden">
    <div id="editTop"><b>배치 모드</b><span>드래그: 화면 이동 · 탭: 선택/위치</span><button class="eb pri" id="eDone">완료</button></div>
    <div id="editBody"></div>
  </div>

  <div id="mgWrap" class="hidden">
    <div id="mgBox"><div id="mgTitle"></div><canvas id="mg"></canvas><div id="mgHint"></div></div>
  </div>

  <div id="modal" class="hidden"><div class="panel" id="panel"></div></div>
  <div id="speech" class="hidden"></div>
  <div id="toasts"></div>
</div>

<script>
// ================== Firebase 설정 ==================
// Firebase 콘솔 > 프로젝트 설정 > 내 앱(웹)의 firebaseConfig 값을 붙여넣기
const FIREBASE_CONFIG = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "",
  appId: ""
};
const FB_VER = '10.12.2';
// ===================================================

/* ---------------- 기본 도우미 ---------------- */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const won = n => (n < 0 ? '-' : '') + '₩' + Math.abs(Math.round(n)).toLocaleString('ko-KR');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const FONT = '"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif';
const OL = 'rgba(60,38,24,.78)';
const pcol = p => p < .25 ? '#e03131' : p < .5 ? '#fab005' : '#2fb344';
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shade(hex,amt){let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');const n=parseInt(c,16);const r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
function rr(g,x,y,w,h,r,fill,stroke,lw){if(w<=0||h<=0)return;r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||2;g.stroke()}}
function circ(g,x,y,r,fill,stroke,lw){g.beginPath();g.arc(x,y,Math.max(0,r),0,Math.PI*2);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||2;g.stroke()}}
function ell(g,x,y,rx,ry,fill,stroke,lw,rot){g.beginPath();g.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),rot||0,0,Math.PI*2);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||2;g.stroke()}}
function line(g,x1,y1,x2,y2,col,lw){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.strokeStyle=col;g.lineWidth=lw||2;g.lineCap='round';g.stroke()}
function tx(g,s,x,y,size,col,w='700',al='center'){g.save();g.font=`${w} ${size}px ${FONT}`;g.fillStyle=col;g.textAlign=al;g.textBaseline='middle';g.fillText(s,x,y);g.restore()}
function bar(g,x,y,w,h,p,col){rr(g,x,y,w,h,h/2,'#eadfd3');p=clamp(p,0,1);if(p>0)rr(g,x,y,Math.max(h,w*p),h,h/2,col)}
function tri(g,x,y,s,fill,stroke){const p=[[x,y-s*.4],[x+s*.42,y+s*.32],[x-s*.42,y+s*.32]];g.beginPath();g.moveTo((p[0][0]+p[2][0])/2,(p[0][1]+p[2][1])/2);for(let i=0;i<3;i++){const a=p[i],b=p[(i+1)%3];g.arcTo(a[0],a[1],b[0],b[1],s*.12)}g.closePath();g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=2;g.stroke()}}
function flame(g,x,y,s,a){g.save();g.globalAlpha=clamp(a==null?1:a,0,1);g.beginPath();g.moveTo(x,y-s);g.quadraticCurveTo(x+s*.6,y-s*.2,x,y);g.quadraticCurveTo(x-s*.6,y-s*.2,x,y-s);g.fillStyle='#ff922b';g.fill();g.beginPath();g.moveTo(x,y-s*.55);g.quadraticCurveTo(x+s*.3,y-s*.1,x,y);g.quadraticCurveTo(x-s*.3,y-s*.1,x,y-s*.55);g.fillStyle='#ffe066';g.fill();g.restore()}
function wavy(g,x1,x2,y,amp,col,lw){g.beginPath();for(let x=x1;x<=x2;x+=2){const yy=y+Math.sin((x-x1)/6)*amp;x===x1?g.moveTo(x,yy):g.lineTo(x,yy)}g.strokeStyle=col;g.lineWidth=lw;g.lineCap='round';g.stroke()}

/* ---------------- 재료/음식 그림 (도형) ---------------- */
const IT={

const OPT_KEY='nyamnyam_opt';
let OPT=(()=>{let o={};try{o=JSON.parse(localStorage.getItem(OPT_KEY)||'{}')}catch(e){}return Object.assign({full:true,sfx:.7,bgm:.35,vib:true,joy:'M',lefty:false},o)})();
function saveOpt(){try{localStorage.setItem(OPT_KEY,JSON.stringify(OPT))}catch(e){}}
let AC=null,sfxGain=null,bgmGain=null,bgmT=0,bgmStep=0;
function audioInit(){if(AC){if(AC.state==='suspended')AC.resume();return}try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();sfxGain=AC.createGain();bgmGain=AC.createGain();sfxGain.connect(AC.destination);bgmGain.connect(AC.destination);applyVol()}catch(e){AC=null}}
function applyVol(){if(!AC)return;sfxGain.gain.value=OPT.sfx;bgmGain.gain.value=OPT.bgm*.3}
function tone(f,dur,type,vol,when,slide,dest){if(!AC)return;const t=AC.currentTime+(when||0);const o=AC.createOscillator(),gn=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol||.3,t+.01);gn.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(gn);gn.connect(dest||sfxGain);o.start(t);o.stop(t+dur+.05)}

function bgmTick(){if(!AC||OPT.bgm<=0||!running||paused||over)return;const spb=(S&&isPeak())?.22:.3;if(bgmT<AC.currentTime)bgmT=AC.currentTime+.05;while(bgmT<AC.currentTime+.25){const bar=Math.floor(bgmStep/8)%4,b=bgmStep%8,ch=PROG[bar];const w=bgmT-AC.currentTime;if(b===0||b===4)tone(ch[0]/2,spb*1.8,'triangle',.5,w,null,bgmGain);tone(ch[[0,1,2,1,0,2,1,2][b]]*2,spb*.9,'sine',.16,w,null,bgmGain);bgmStep++;bgmT+=spb}}

let FX=[];
function fxText(x,y,text,col){FX.push({k:'t',x,y,text,col,t:0,life:1.3})}
function fxCoins(x,y,n){for(let i=0;i<n;i++)FX.push({k:'c',x,y,vx:rnd(-45,45),vy:rnd(-120,-60),t:0,life:.9})}
function fxHeart(x,y){FX.push({k:'h',x,y,t:0,life:1.3})}
function fxConfetti(x,y){for(let i=0;i<45;i++)FX.push({k:'f',x,y,vx:rnd(-130,130),vy:rnd(-220,-60),col:pick(['#ff6b6b','#fcc419','#51cf66','#4dabf7','#f06595']),t:0,life:1.7})}
function updFX(dt){for(const f of FX){f.t+=dt;if(f.k==='c'||f.k==='f'){f.vy+=320*dt;f.x+=f.vx*dt;f.y+=f.vy*dt}}FX=FX.filter(f=>f.t<f.life);if(FX.length>300)FX=FX.slice(-300)}
function heartShape(g,x,y,s,col){g.beginPath();g.moveTo(x,y+s*.5);g.bezierCurveTo(x-s,y-s*.2,x-s*.5,y-s,x,y-s*.35);g.bezierCurveTo(x+s*.5,y-s,x+s,y-s*.2,x,y+s*.5);g.fillStyle=col;g.fill()}
function txo(g,str,x,y,size,col){g.save();g.font=`900 ${size}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.lineWidth=3.5;g.strokeStyle='#fff';g.strokeText(str,x,y);g.fillStyle=col;g.fillText(str,x,y);g.restore()}
function drawFX(g){for(const f of FX){const a=clamp((1-f.t/f.life)*1.6,0,1);g.save();g.globalAlpha=a;if(f.k==='t')txo(g,f.text,f.x,f.y-f.t*32,13,f.col);else if(f.k==='c')circ(g,f.x,f.y,4,'#fcc419','#e67700',1.2);else if(f.k==='h')heartShape(g,f.x+Math.sin(f.t*6)*4,f.y-f.t*28,8,'#f06595');else if(f.k==='f'){g.fillStyle=f.col;g.fillRect(f.x,f.y,4,6)}g.restore()}}
function bob(o){const mv=o._lx!=null&&Math.hypot(o.x-o._lx,o.y-o._ly)>.25;o._lx=o.x;o._ly=o.y;o._bt=mv?(o._bt||0)+.016:0;return mv?-Math.abs(Math.sin((o._bt||0)*14))*2.5:0}
function steam(g,x,y){for(let i=0;i<3;i++){const ph=(playT*.8+i/3)%1;g.save();g.globalAlpha=(1-ph)*.6;wavy(g,x-6+i*6,x-2+i*6,y-ph*18,2,'#fff',2);g.restore()}}

function toTitle(){abortMG();saveLocal();cloudSave();running=false;paused=false;over=false;$('modal').classList.add('hidden');['hud','sideBtns','controls','editBar','tutBar'].forEach(id=>$(id).classList.add('hidden'));editMode=false;$('title').classList.remove('hidden');const b=$('startBtn');b.disabled=false;b.textContent='영업 시작';initTitle()}
function gameOver(){if(over)return;over=true;abortMG();lastRun={total:S.total,day:S.day,dishes:S.dishes};lastRunBest=S.total>S.runStartBest;if(S.total>S.bestSent){const d=rankData();S.bestSent=S.total;submitRank(d).catch(e=>console.warn(e))}const name=S.name,best=Math.max(S.bestSent,S.total);S=fresh(name,best);S.cands=[genCand(),genCand(),genCand()];resetWorld();saveLocal();cloudSave();showOver()}
function showOver(){paused=true;showModal(`<div class="center" style="padding-top:24px"><h2 style="margin:0">파산했습니다…</h2><div class="stat">평판이 바닥나서 가게 문을 닫았어요.</div><div class="stat">총매출 <b>${won(lastRun.total)}</b>${lastRunBest?' · 개인 최고!':''}<br>${lastRun.day}일차까지 영업 · 요리 ${lastRun.dishes}개</div><div class="note">${FB.on?(lastRunBest?'랭킹 기록이 갱신됐어요':'랭킹엔 이전 최고 기록이 남아 있어요'):'오프라인이라 랭킹엔 기록되지 않았어요'}</div><button class="big" data-o="again">처음부터 다시</button><button class="ghost" data-o="rank">랭킹 보기</button></div>`);
 $('panel').onclick=e=>{const b=e.target.closest('[data-o]');if(!b)return;if(b.dataset.o==='again'){$('modal').classList.add('hidden');over=false;paused=false;toast('새 가게 오픈!')}else openRank(true)}}

function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;$('toasts').appendChild(d);setTimeout(()=>d.remove(),2600);while($('toasts').children.length>4)$('toasts').firstChild.remove()}

/* ---------------- 시작 / 루프 ---------------- */
function resetWorld(){groups=[];tickets=[];FS={};playT=0;rebuild();chef=newChef();S.staff.forEach(s=>{s.a=null});S.clean=Math.max(0,S.plates-S.dirty)}
function cleanOrphans(){S.furn.forEach(p=>{if(!isHold(p)||!FS[p.id])return;const it=FS[p.id].items;for(let i=it.length-1;i>=0;i--){if(!tickets.find(t=>t.id===it[i].tid)&&!it[i].claimed){it.splice(i,1);S.dirty++}}})}
let emptyT=0,orphanT=0,saveT=0;
function update(dt){playT+=dt;updResv();updRegs();updInc(dt);S.min+=dt*GAME_SPEED;if(S.rep<100)S.rep=Math.min(100,S.rep+decoRegen()*dt);if(S.min>=840){S.min-=840;dayRoll()}
 for(const s of S.staff)if(onShift(s))S.wageDue=(S.wageDue||0)+s.wage/60*dt*GAME_SPEED;
 const q=groups.filter(g=>g.state==='arrive'||g.state==='queue').length;const freeT=S.furn.some(t=>isTable(t)&&!fs(t.id).group&&!fs(t.id).reserved);emptyT=q?0:emptyT+dt;
 const rate=(1/14)*(.4+S.rep/100*1.2)*(isPeak()?2:1)*(1+.12*S.up.ad)*(1+Math.min(.4,decoScore()*.012))*Math.min(1.6,1+.06*(S.day-1))*(playT<buzzUntil?1.6:1)*EV().spawn;
 const pg=progress(),qcap=3+Math.round(2*pg);if(S.tut>=0){if(!groups.some(g=>g.state!=='leave')&&emptyT>1.5){spawnGroup();emptyT=0}}else if(q<qcap&&(Math.random()<rate*(.75+.25*pg)*dt||(freeT&&emptyT>5))){spawnGroup();emptyT=0}
 if(!mgCtl)moveChef(dt);
 updGroups(dt);if(over)return;
 S.staff.forEach(s=>updStaff(s,dt));separate();
 orphanT+=dt;if(orphanT>1){orphanT=0;cleanOrphans()}
 if(mgCtl)mgUpdate(dt);
 saveT+=dt;if(saveT>10){saveT=0;saveLocal();cloudFlag=true}
 if(cloudFlag&&Date.now()-lastCloud>8000)cloudSave()}
let lastTs=0,uiT=0;
function frame(ts){const dt=Math.min(.05,(ts-lastTs)/1000||0);lastTs=ts;updFX(dt);bgmTick();if(!$('title').classList.contains('hidden'))drawLogo(ts/1000);
 if(running&&!paused&&!over)update(dt);
 if(running){render();uiT+=dt;if(uiT>.1&&!editMode){uiT=0;updHud();updAct();updTut();if(!paused&&!over&&!mgCtl&&$('modal').classList.contains('hidden')){checkLevel()||checkDiscover()||checkAch()}}}
 requestAnimationFrame(frame)}

function drawLogo(t){t=t||0;const c=$('logo'),g=c.getContext('2d');g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,120,100);circ(g,60,58,40,'#ffe8cc');const b=-Math.abs(Math.sin(t*3))*3;g.save();g.translate(52,62+b);g.scale(2.4,2.4);person(g,0,0,Math.PI/2,'#ffffff','#f8d5b8','#2b1d14','#ffffff');g.restore();drawDish(g,'ramen',96,74,26);for(let i=0;i<3;i++){const ph=(t*.7+i/3)%1;g.save();g.globalAlpha=(1-ph)*.7;wavy(g,90+i*6,94+i*6,62-ph*22,2,'#adb5bd',2);g.restore()}}
function initTitle(){const l=loadLocal();const nb=$('newBtn');nb.textContent='처음부터 새로 시작';nb.dataset.armed='';if(l){$('nameIn').value=l.name||'';$('saveInfo').textContent=`이어하기: ${l.day||1}일차 · ${won(l.money||0)}`;nb.classList.remove('hidden')}else{$('saveInfo').textContent='';nb.classList.add('hidden')}}
drawLogo();initTitle();applyOpt();
let forceNew=false;
$('newBtn').onclick=()=>{const nb=$('newBtn');if(!nb.dataset.armed){nb.dataset.armed='1';nb.textContent='정말? 한 번 더 누르면 초기화';return}forceNew=true;startGame()};
function goFull(){if(OPT.full===false)return;const el=document.documentElement;if(document.fullscreenElement||document.webkitFullscreenElement)return;try{const r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el,{navigationUI:'hide'});if(r&&r.catch)r.catch(()=>{})}catch(e){}}
window.addEventListener('resize',()=>setTimeout(resize,60));
async function startGame(){goFull();const b=$('startBtn');b.disabled=true;b.textContent='가게 여는 중…';const name=($('nameIn').value.trim()||('사장님'+Math.floor(1000+Math.random()*9000))).slice(0,10);
 await fbReady;const local=loadLocal();let cloud=null;if(FB.on){try{cloud=await cloudLoad()}catch(e){console.warn(e)}}
 let src=local;if(cloud&&(!local||(cloud.savedAt||0)>(local.savedAt||0)))src=cloud;
 if(forceNew){const best=src?Math.max(src.bestSent||0,src.total||0):0;S=fresh(name,best);forceNew=false}else S=src?merge(src):fresh(name,0);S.name=name;resetWorld();saveLocal();
 running=true;over=false;paused=false;$('title').classList.add('hidden');['hud','sideBtns','controls'].forEach(id=>$(id).classList.remove('hidden'));updHud();toast(`${S.name}의 식당 영업 시작! 입구의 손님에게 가서 버튼을 눌러 안내하세요`)}
$('startBtn').onclick=startGame;$('titleRank').onclick=()=>openRank(false);
$('tutSkip').onclick=()=>{if(S){S.tut=-1;saveLocal();updTut();toast('튜토리얼을 건너뛰었어요')}};
$('bEdit').onclick=enterEdit;$('bStaff').onclick=()=>openStaff();$('bShop').onclick=openShop;$('bRank').onclick=()=>{if(running&&!editMode)openRank(false)};$('bPause').onclick=openPause;
window.addEventListener('pagehide',()=>{if(running&&S)saveLocal()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&S){saveLocal();cloudSave();if(!over&&!editMode&&$('modal').classList.contains('hidden'))openPause()}});
resize();requestAnimationFrame(frame);
</script>
</body>
</html>
