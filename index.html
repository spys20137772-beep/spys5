<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>탭탭 아케이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<style>
/*
VOICE: 오락실 기계 앞에 선 기분, 짧고 신나게
IDEA: 동전 넣고 고르는 아케이드 게임 선택 화면
PICTURE: 게임마다 직접 그린 카드 그림 (궤도 행성 / 줄에 매달린 막대인간)
COLOUR and TYPE: 밤하늘 남색 바탕, 게임별 고유 색, Do Hyeon 제목 + Gowun Dodum 본문
LAYOUT: 상단 로고, 그 아래 카드 격자 (폰 2열, 넓으면 3~4열), 게임은 전체 화면 iframe
*/
:root{color-scheme:dark;--bg:#0c0a24;--bg2:#1a1446;--ink:#f1f0ff;--mute:#9b98c9;--line:rgba(255,255,255,.12);--gold:#ffd36b;
 --fd:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--fb:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 70% at 50% 0%,var(--bg2),var(--bg) 65%) fixed,var(--bg);color:var(--ink);font:16px/1.5 var(--fb);overflow-x:clip;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.wrap{max-width:980px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 28px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(16px,env(safe-area-inset-left,0px))}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.logo{font:400 clamp(40px,11vw,64px)/1 var(--fd);margin:0;letter-spacing:.01em;text-wrap:balance}
.logo span{display:block;font-size:.42em;color:var(--mute);margin-top:8px;letter-spacing:.04em}
.count{font:400 15px var(--fd);color:var(--gold);background:rgba(255,211,107,.1);border:1px solid rgba(255,211,107,.35);padding:6px 12px;border-radius:999px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,44vw),1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;border:1.5px solid var(--line);background:#14113a;color:inherit;text-align:left;padding:0;font:inherit;cursor:pointer;transition:transform .15s ease,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--c)}
.card:active{transform:scale(.97)}
.card:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.art{aspect-ratio:1/1;width:100%;display:block;background:var(--g)}
.art svg{width:100%;height:100%;display:block}
.meta{padding:10px 12px 12px;display:grid;gap:2px}
.name{font:400 22px/1.1 var(--fd)}
.rec{font-size:13px;color:var(--mute);white-space:nowrap}
.rec b{color:var(--c);font-weight:400;font-family:var(--fd);font-size:15px}
.play{position:absolute;top:10px;right:10px;font:400 14px var(--fd);background:var(--c);color:#0c0a24;padding:4px 11px;border-radius:999px}
.soon{cursor:default;border-style:dashed;background:transparent}
.soon:hover{transform:none;border-color:var(--line)}
.soon .art{display:grid;place-items:center;background:rgba(255,255,255,.03);font:400 54px var(--fd);color:rgba(255,255,255,.14)}
.soon .name{color:var(--mute)}
.foot{margin-top:22px;font-size:13px;color:var(--mute)}
#game{position:fixed;inset:0;z-index:50;background:#000;display:none}
#game.on{display:block}
#game iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
#home{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);z-index:2;height:34px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(10,8,30,.55);color:#fff;font:400 15px var(--fd);cursor:pointer;opacity:.7;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#home:hover,#home:focus-visible{opacity:1}
@media (prefers-reduced-motion:reduce){.card{transition:none}.spin{animation:none!important}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes swing{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(24deg)}}
.spin{transform-origin:100px 108px;animation:spin 5s linear infinite}
.sw{transform-origin:118px 36px;animation:swing 1.6s ease-in-out infinite}
</style>
</head>
<body>
<div class="wrap" id="hub">
 <header>
  <h1 class="logo">탭탭 아케이드<span>손가락 하나로 하는 미니게임 모음</span></h1>
  <div class="count" id="count">게임 2 / 10</div>
 </header>
 <div class="grid" id="grid"></div>
 <p class="foot">게임 안에서 위쪽 가운데 「← 홈」 버튼이나 뒤로 가기로 돌아와요. 기록은 이 브라우저에 저장돼요.</p>
</div>

  <g stroke="#ff2bd6" stroke-width="10" stroke-linecap="round" opacity=".3" fill="none"><path d="M118 122 v26 M118 126 l-12 -14 l12 -14 M118 126 l12 -14 l-12 -14 M118 148 l-8 20 M118 148 l9 18"/><circle cx="118" cy="114" r="8"/></g>
  <g stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"><path d="M118 122 v26 M118 126 l-12 -14 l12 -14 M118 126 l12 -14 l-12 -14 M118 148 l-8 20 M118 148 l9 18"/><circle cx="118" cy="114" r="8" fill="#0b0424"/></g></g>

</svg>`
};

const GAMES=[
 {id:'orbit',name:'궤도 점프',c:'#6be3c5',g:'#0b1030',rec:()=>{const b=ls('orbit-hop-best');return b?`최고 <b>${b}</b>점`:'아직 기록 없음'}},
 {id:'swing',name:'SWING RUN',c:'#00f0ff',g:'#0b0424',rec:()=>{const b=ls('swingrun_best');return b?`최고 <b>${b}m</b>`:'아직 기록 없음'}},
];
const SOON=8;

function render(){
 $('grid').innerHTML=GAMES.map(g=>`<button class="card" type="button" data-id="${g.id}" style="--c:${g.c};--g:${g.g}">
  <span class="play">PLAY</span><span class="art">${ART[g.id]}</span>
  <span class="meta"><span class="name">${g.name}</span><span class="rec">${g.rec()}</span></span></button>`).join('')
 +Array.from({length:SOON},()=>`<div class="card soon" aria-hidden="true"><span class="art">?</span><span class="meta"><span class="name">곧 추가</span><span class="rec">새 미니게임</span></span></div>`).join('');
 $('count').textContent=`게임 ${GAMES.length} / ${GAMES.length+SOON}`;
}

const cache={};
function source(id){
 if(!cache[id]){const b=atob($('src-'+id).textContent.trim());const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);cache[id]=new TextDecoder().decode(u);}
 return cache[id];
}

let frame=null;
function open(id,push){
 close(false);
 frame=document.createElement('iframe');
 frame.title=GAMES.find(g=>g.id===id).name;
 frame.setAttribute('allow','autoplay; fullscreen');
 frame.srcdoc=source(id);
 frame.addEventListener('load',()=>{try{frame.contentWindow.focus()}catch(e){}});
 $('game').appendChild(frame);
 $('game').classList.add('on');$('game').setAttribute('aria-hidden','false');$('hub').setAttribute('aria-hidden','true');
 if(push){try{history.pushState({g:id},'')}catch(e){}}
}
function close(back){
 if(frame){frame.srcdoc='';frame.remove();frame=null;}
 $('game').classList.remove('on');$('game').setAttribute('aria-hidden','true');$('hub').removeAttribute('aria-hidden');
 render();
 if(back&&history.state&&history.state.g){try{history.back()}catch(e){}}
}

$('grid').addEventListener('click',e=>{const c=e.target.closest('.card[data-id]');if(c)open(c.dataset.id,true);});
$('home').addEventListener('click',()=>close(true));
addEventListener('popstate',()=>{if(frame)close(false);});
render();
}
</script>
