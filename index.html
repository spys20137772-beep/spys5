<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>프로토타입 아케이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--bg:#0c0d12;--panel:#15171f;--line:#262a36;--ink:#eef0f6;--dim:#8b90a3;--acc:#d7ff3a;--hot:#ff4d6d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}

/* gate */
#gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:
 repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px),var(--bg)}
.gbox{width:min(360px,100%);border:1.5px solid var(--line);border-radius:18px;background:var(--panel);padding:26px 22px 22px}
.gtag{display:inline-block;font-size:11px;letter-spacing:3px;color:#0c0d12;background:var(--acc);padding:4px 8px;border-radius:4px;font-weight:700}
.gbox h1{font:400 30px/1.15 'Black Han Sans',sans-serif;margin:14px 0 6px}
.gbox p{margin:0 0 18px;color:var(--dim);font-size:14px;line-height:1.5}
#code{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:#0c0d12;color:var(--ink);font:700 18px 'JetBrains Mono',monospace;letter-spacing:2px;outline:none}
#code:focus{border-color:var(--acc)}
#enter{width:100%;margin-top:10px;padding:14px;border-radius:12px;background:var(--acc);color:#0c0d12;font-weight:700;font-size:16px}
#enter:active{transform:scale(.98)}
#gmsg{min-height:20px;margin-top:10px;font-size:13px;color:var(--hot)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* home */
#home{max-width:980px;margin:0 auto;padding:22px 16px 60px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
header h1{font:400 clamp(28px,8vw,44px)/1 'Black Han Sans',sans-serif;margin:0}
header h1 span{color:var(--acc)}
.badge{font-size:11px;letter-spacing:2px;border:1.5px solid var(--acc);color:var(--acc);padding:4px 8px;border-radius:4px;white-space:nowrap}
#note{font-size:12px;color:var(--dim);margin:-6px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{border:1.5px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden;display:flex;flex-direction:column}
.thumb{height:128px;position:relative;overflow:hidden}
.thumb svg{position:absolute;inset:0;width:100%;height:100%}
.thumb .gname{position:absolute;left:14px;bottom:10px;font:400 26px/1 'Black Han Sans',sans-serif;text-shadow:0 2px 0 rgba(0,0,0,.6)}
.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.ctag{font-size:11px;color:var(--acc);letter-spacing:1.5px}
.cdesc{font-size:14px;line-height:1.5;color:#c6cad8;margin:0;flex:1}
.crow{display:flex;gap:8px;align-items:center}
.play{flex:1;padding:12px;border-radius:10px;background:var(--acc);color:#0c0d12;font-weight:700}
.play:active{transform:scale(.98)}
.chip{display:flex;align-items:center;gap:6px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);font-size:14px;font-weight:700;min-width:58px;justify-content:center}
.chip svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.chip.on{border-color:var(--hot);color:var(--hot)}
.chip.on svg{fill:var(--hot)}

/* play */
#play{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
.pbar{height:42px;flex:none;display:flex;align-items:center;gap:10px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.pbar b{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtn{padding:6px 10px;border-radius:8px;border:1.5px solid var(--line);font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px}
.pbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.pbtn.on{border-color:var(--hot);color:var(--hot)}.pbtn.on svg{fill:var(--hot)}
#fw{flex:1;position:relative}
#fw iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}

/* comments sheet */
#sheet{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sbox{width:min(560px,100%);max-height:82vh;background:var(--panel);border:1.5px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.shead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.shead b{font:400 20px 'Black Han Sans',sans-serif}
#clist{overflow:auto;padding:6px 16px;flex:1;min-height:120px}
.cm{padding:10px 0;border-bottom:1px solid var(--line)}
.cm .who{font-size:12px;color:var(--dim);display:flex;gap:8px;align-items:center}
.cm .who b{color:var(--acc);font-weight:700}
.cm .who button{margin-left:auto;color:var(--dim);font-size:12px;text-decoration:underline}
.cm p{margin:4px 0 0;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.empty{color:var(--dim);font-size:14px;padding:26px 0;text-align:center}
.cform{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
#ctext{flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:#0c0d12;color:var(--ink);font:inherit;font-size:15px;outline:none;resize:none;height:46px}
#ctext:focus{border-color:var(--acc)}
#csend{padding:0 16px;border-radius:10px;background:var(--acc);color:#0c0d12;font-weight:700}
#csend:disabled{opacity:.4}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:#fff;color:#0c0d12;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:700;max-width:90vw}
</style>
</head>
<body>

<div id="gate">
 <form class="gbox" id="gform">
  <span class="gtag mono">ALPHA TESTER</span>
  <h1>알파 테스터 인증</h1>
  <p>초대받은 테스터만 들어올 수 있어. 받은 코드를 입력해.</p>
  <input id="code" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="인증 코드" aria-label="인증 코드">
  <button id="enter" type="submit">인증하기</button>
  <div id="gmsg" role="alert"></div>
 </form>
</div>

<main id="home" hidden>
 <header>
  <h1>프로토타입 <span>아케이드</span></h1>
  <span class="badge mono">ALPHA</span>
 </header>
 <div id="note" hidden></div>
 <div class="grid" id="grid"></div>
</main>

<div id="play" hidden>
 <div class="pbar">
  <button class="pbtn" id="pexit">나가기</button>
  <b id="ptitle"></b>
  <button class="pbtn" id="plike" aria-label="좋아요"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span></span></button>
  <button class="pbtn" id="pcmt">댓글 <span></span></button>
 </div>
 <div id="fw"></div>
</div>

<div id="sheet" hidden>
 <div class="sbox">
  <div class="shead"><b id="stitle"></b><button class="pbtn" id="sclose">닫기</button></div>
  <div id="clist"></div>
  <form class="cform" id="cform">
   <textarea id="ctext" maxlength="300" placeholder="플레이 후기, 버그, 아이디어..." aria-label="댓글"></textarea>
   <button id="csend" type="submit">등록</button>
  </form>
 </div>
</div>
<div id="toast" hidden></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const HEART='<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>';
const GAMES=[
 {id:'stop-world',name:'멈춘 세계',tag:'탄 피하기',file:'games/stop-world.html',
  desc:'움직일 때만 시간이 흐른다. 멈춰서 탄을 읽고, 한 칸씩 계산해서 피해.',
  art:'<rect width="300" height="128" fill="#101426"/><g fill="#ff4d6d"><circle cx="60" cy="30" r="5"/><circle cx="110" cy="70" r="5"/><circle cx="175" cy="38" r="5"/><circle cx="230" cy="84" r="5"/><circle cx="262" cy="26" r="5"/><circle cx="150" cy="100" r="5"/></g><g stroke="#ff4d6d" stroke-width="2" opacity=".35"><path d="M60 30l-26-14M110 70l-30-8M175 38l-22-20M230 84l-30 6M262 26l-24-10"/></g><circle cx="200" cy="58" r="9" fill="#6ee7ff"/><circle cx="200" cy="58" r="17" fill="none" stroke="#6ee7ff" stroke-width="1.5" opacity=".5"/>'},
 {id:'thief',name:'밤의 도둑',tag:'잠입',file:'games/thief.html',
  desc:'경비 시야를 피해 랜덤 저택을 턴다. 발각 게이지가 차기 전에 빠져나와.',
  art:'<rect width="300" height="128" fill="#0d1420"/><g stroke="#24324a" stroke-width="3" fill="none"><path d="M20 20h110v50M170 20h110v88H20V70M130 108V90"/></g><path d="M210 60l70-34v68z" fill="#ffd84d" opacity=".28"/><circle cx="210" cy="60" r="8" fill="#ffd84d"/><circle cx="74" cy="84" r="7" fill="#8ff0a4"/><rect x="92" y="34" width="12" height="12" fill="#c9a227"/>'},
 {id:'physics',name:'물리 놀이터',tag:'3D 샌드박스',file:'games/physics.html',
  desc:'목표 없음. 블록을 쌓고, 던지고, 무너뜨리면서 그냥 노는 3D 물리 놀이터.',
  art:'<rect width="300" height="128" fill="#1a1530"/><path d="M0 104h300v24H0z" fill="#2a2350"/><g stroke="#0c0d12" stroke-width="2"><rect x="150" y="70" width="34" height="34" fill="#ff8a3c"/><rect x="186" y="70" width="34" height="34" fill="#6ee7ff"/><rect x="168" y="36" width="34" height="34" fill="#d7ff3a" transform="rotate(8 185 53)"/><rect x="236" y="52" width="26" height="26" fill="#ff4d6d" transform="rotate(-24 249 65)"/></g><circle cx="76" cy="54" r="16" fill="#c084fc" stroke="#0c0d12" stroke-width="2"/><path d="M40 70q18-22 36-16" stroke="#c084fc" stroke-width="2" fill="none" stroke-dasharray="4 5" opacity=".6"/>'},
 {id:'swing-run',name:'SWING RUN',tag:'그래플 러너',file:'games/swing-run.html',
  desc:'꾹 눌러 고리에 줄을 걸고, 떼서 날아가. 뒤에서 쫓아오는 것보다 빨라야 해.',
  art:'<rect width="300" height="128" fill="#0b0424"/><path d="M0 118h300" stroke="#ff2b6a" stroke-width="4"/><g fill="none" stroke="#00f0ff" stroke-width="3"><circle cx="90" cy="30" r="9"/><circle cx="190" cy="24" r="9"/><circle cx="270" cy="40" r="9"/></g><path d="M190 24L150 82" stroke="#fff" stroke-width="2"/><circle cx="150" cy="82" r="7" fill="#fff"/><path d="M96 70q26 26 54 12" stroke="#ff2bd6" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/><rect x="0" y="0" width="18" height="128" fill="#ff2b6a" opacity=".35"/>'},
 {id:'orbit-jump',name:'궤도 점프',tag:'원터치 점프',file:'games/orbit-jump.html',
  desc:'행성 궤도를 도는 탐사선. 딱 맞는 순간에 탭해서 다음 행성의 중력권으로 뛰어들어.',
  art:'<rect width="300" height="128" fill="#0b1030"/><g fill="#eef0ff" opacity=".6"><rect x="20" y="18" width="2" height="2"/><rect x="250" y="14" width="2" height="2"/><rect x="140" y="110" width="2" height="2"/><rect x="40" y="96" width="2" height="2"/><rect x="280" y="100" width="2" height="2"/></g><circle cx="90" cy="76" r="44" fill="none" stroke="#9aa3d6" stroke-width="1.2" stroke-dasharray="3 6" opacity=".5"/><circle cx="90" cy="76" r="20" fill="#ff8a6b"/><circle cx="222" cy="46" r="40" fill="none" stroke="#6be3c5" stroke-width="1.4" stroke-dasharray="3 6"/><circle cx="222" cy="46" r="16" fill="#6be3c5"/><ellipse cx="222" cy="46" rx="27" ry="7" fill="none" stroke="#eef0ff" stroke-width="2" opacity=".6" transform="rotate(-20 222 46)"/><path d="M128 52l30-10" stroke="#eef0ff" stroke-width="1.5" stroke-dasharray="2 5" opacity=".6"/><path d="M134 50l-12-5 3 5-3 5z" fill="#eef0ff"/><path d="M170 74l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" fill="#ffd36b"/>'}
];
const byId=id=>GAMES.find(g=>g.id===id);

/* ---------- gate ---------- */
const H256='ee4b9b9316aba2590bcf7324920eb2145cf97756a9c8a9d1153752f07ed31dff',HFNV=981325878;
async function codeOK(s){
 try{if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')===H256;}}catch(e){}
 let h=0x811c9dc5;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,0x01000193)>>>0;}return h===HFNV;
}
function unlock(){$('gate').hidden=true;$('home').hidden=false;}
try{if(localStorage.getItem('hub_alpha')==='1')unlock();}catch(e){}
$('gform').addEventListener('submit',async e=>{
 e.preventDefault();const v=$('code').value.trim();
 if(await codeOK(v)){try{localStorage.setItem('hub_alpha','1');}catch(_){}unlock();}
 else{$('gmsg').textContent=v?'코드가 틀렸어. 다시 확인해봐.':'코드를 입력해.';const b=$('gform');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');$('code').select();}
});

/* ---------- shared state (likes / comments) ---------- */
const st={likes:new Map(),cmts:new Map(),names:{},me:null,owner:false,db:null,user:null,local:false,busy:false};
let openGame=null,sheetGame=null;
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600);}
function likeCount(g){let n=0;for(const d of st.likes.values())if(d&&d.g&&d.g[g])n++;return n;}
function iLike(g){const d=st.likes.get(st.me);return !!(d&&d.g&&d.g[g]);}
function cmtsOf(g){const out=[];for(const [uid,d] of st.cmts){for(const c of (d&&Array.isArray(d.items)?d.items:[])){if(c&&c.g===g&&typeof c.t==='string')out.push({uid,id:String(c.id),t:c.t.slice(0,300),ts:+c.ts||0});}}
 return out.sort((a,b)=>b.ts-a.ts);}
function fmt(ts){if(!ts)return'';const d=new Date(ts),p=n=>String(n).padStart(2,'0');return (d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes());}

function buildCards(){
 const grid=$('grid');
 for(const g of GAMES){
  const c=document.createElement('article');c.className='card';
  const th=document.createElement('div');th.className='thumb';
  th.innerHTML='<svg viewBox="0 0 300 128" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+g.art+'</svg>';
  const nm=document.createElement('div');nm.className='gname';nm.textContent=g.name;th.appendChild(nm);
  const body=document.createElement('div');body.className='cbody';
  const tag=document.createElement('div');tag.className='ctag mono';tag.textContent=g.tag;
  const ds=document.createElement('p');ds.className='cdesc';ds.textContent=g.desc;
  const row=document.createElement('div');row.className='crow';
  const pl=document.createElement('button');pl.className='play';pl.textContent='플레이';pl.addEventListener('click',()=>play(g.id));
  const lk=document.createElement('button');lk.className='chip';lk.id='lk-'+g.id;lk.setAttribute('aria-label','좋아요');lk.innerHTML=HEART+'<span>0</span>';lk.addEventListener('click',()=>toggleLike(g.id));
  const cm=document.createElement('button');cm.className='chip';cm.id='cm-'+g.id;cm.innerHTML='<span>댓글 0</span>';cm.addEventListener('click',()=>openSheet(g.id));
  row.append(pl,lk,cm);body.append(tag,ds,row);c.append(th,body);grid.appendChild(c);
 }
}
function refresh(){
 for(const g of GAMES){
  const lk=$('lk-'+g.id);lk.classList.toggle('on',iLike(g.id));lk.querySelector('span').textContent=likeCount(g.id);
  $('cm-'+g.id).querySelector('span').textContent='댓글 '+cmtsOf(g.id).length;
 }
 if(openGame){const b=$('plike');b.classList.toggle('on',iLike(openGame));b.querySelector('span').textContent=likeCount(openGame);$('pcmt').querySelector('span').textContent=cmtsOf(openGame).length;}
 if(sheetGame)renderSheet();
}
async function resolveNames(ids){
 if(!st.user||!ids.length)return;
 try{const ps=await st.user.profiles(ids);for(const id of ids)st.names[id]=(ps&&ps[id]&&ps[id].name)||'';}catch(e){}
}
async function renderSheet(){
 const g=sheetGame,list=cmtsOf(g),box=$('clist');
 $('stitle').textContent=byId(g).name+' 댓글 '+list.length;
 const need=[...new Set(list.map(c=>c.uid))].filter(id=>!(id in st.names));
 if(need.length){await resolveNames(need);if(sheetGame!==g)return;}
 box.textContent='';
 if(!list.length){const e=document.createElement('div');e.className='empty';e.textContent='아직 댓글이 없어. 첫 후기를 남겨봐.';box.appendChild(e);return;}
 for(const c of list){
  const el=document.createElement('div');el.className='cm';
  const who=document.createElement('div');who.className='who';
  const b=document.createElement('b');b.textContent=c.uid===st.me?(st.local?'나':(st.names[c.uid]||'나')):(st.names[c.uid]||'테스터');
  const t=document.createElement('span');t.textContent=fmt(c.ts);who.append(b,t);
  if(c.uid===st.me||st.owner){const d=document.createElement('button');d.type='button';d.textContent='삭제';d.addEventListener('click',()=>delComment(c.uid,c.id));who.appendChild(d);}
  const p=document.createElement('p');p.textContent=c.t;el.append(who,p);box.appendChild(el);
 }
}
function openSheet(g){sheetGame=g;$('sheet').hidden=false;renderSheet();}
function closeSheet(){sheetGame=null;$('sheet').hidden=true;}
$('sclose').addEventListener('click',closeSheet);
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))closeSheet();});

/* writes: one doc per person (likes/<me>, comments/<me>), one write at a time */
function saveLocal(){try{localStorage.setItem('hub_local',JSON.stringify({l:st.likes.get(st.me)||{},c:st.cmts.get(st.me)||{}}));}catch(e){}}
async function writeDoc(kind,data){
 if(st.local){(kind==='likes'?st.likes:st.cmts).set(st.me,data);saveLocal();refresh();return true;}
 if(!st.db||!st.me){toast('아직 연결 중이야. 잠깐 뒤에 다시 해봐.');return false;}
 if(st.busy)return false;st.busy=true;
 try{await st.db.doc(kind+'/'+st.me).set(data);return true;}
 catch(e){toast(e&&e.code==='invalid_argument'?'쓰기 권한이 없어. 기여자 이상으로 공유받아야 해.':'저장에 실패했어. 다시 시도해봐.');return false;}
 finally{st.busy=false;}
}
async function writeOther(uid,data){ // owner moderation
 if(st.busy)return;st.busy=true;
 try{await st.db.doc('comments/'+uid).set(data);}catch(e){toast('삭제에 실패했어.');}finally{st.busy=false;}
}
function toggleLike(g){
 const cur=st.likes.get(st.me),m=Object.assign({},cur&&cur.g);
 if(m[g])delete m[g];else m[g]=true;
 writeDoc('likes',{g:m});
}
async function addComment(g,text){
 const cur=st.cmts.get(st.me),items=(cur&&Array.isArray(cur.items)?cur.items.slice():[]);
 items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),g,t:text,ts:Date.now()});
 while(items.length>60)items.shift();
 return writeDoc('comments',{items});
}
function delComment(uid,id){
 const cur=st.cmts.get(uid);if(!cur)return;
 const items=cur.items.filter(c=>String(c.id)!==id);
 if(uid===st.me)writeDoc('comments',{items});else if(st.owner&&st.db)writeOther(uid,{items});
}
$('cform').addEventListener('submit',async e=>{
 e.preventDefault();const ta=$('ctext'),t=ta.value.trim();if(!t||!sheetGame)return;
 $('csend').disabled=true;const ok=await addComment(sheetGame,t);$('csend').disabled=false;if(ok)ta.value='';
});
$('ctext').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('cform').requestSubmit();}});

/* ---------- play ---------- */
function play(id){
 const g=byId(id);openGame=id;$('ptitle').textContent=g.name;
 const f=document.createElement('iframe');f.src=g.file;f.title=g.name;f.setAttribute('allow','fullscreen; autoplay; gamepad');
 $('fw').textContent='';$('fw').appendChild(f);$('play').hidden=false;refresh();
 f.addEventListener('load',()=>{try{f.contentWindow.focus();}catch(e){}});
}
$('pexit').addEventListener('click',()=>{$('fw').textContent='';$('play').hidden=true;openGame=null;});
$('plike').addEventListener('click',()=>openGame&&toggleLike(openGame));
$('pcmt').addEventListener('click',()=>openGame&&openSheet(openGame));

/* ---------- connect ---------- */
function goLocal(){
 st.local=true;st.me='local';
 try{const s=JSON.parse(localStorage.getItem('hub_local')||'{}');if(s.l)st.likes.set('local',s.l);if(s.c)st.cmts.set('local',s.c);}catch(e){}
 const n=$('note');n.textContent='지금은 공유 저장소에 연결되지 않아서 좋아요·댓글이 이 기기에만 저장돼.';n.hidden=false;refresh();
}
buildCards();refresh();
(async()=>{
 let db=null,user=null;
 try{if(window.claude&&claude.use){[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);}}catch(e){}
 let me=null;try{me=user?await user.id():null;}catch(e){}
 if(!db||!me){goLocal();return;}
 st.db=db;st.user=user;st.me=me;try{st.owner=!!(await user.isOwner());}catch(e){}
 const n=$('note');let got=0;
 const timer=setTimeout(()=>{n.textContent='좋아요·댓글을 아직 불러오지 못했어. 연결되면 자동으로 보여.';n.hidden=false;},10000);
 const done=()=>{if(++got>=2){clearTimeout(timer);n.hidden=true;}};
 const sub=(name,map)=>{let first=true;db.collection(name).onSnapshot(s=>{
   map.clear();for(const d of s.docs){const v=d.data();if(v)map.set(d.id,v);}
   if(first&&!s.metadata.fromCache){first=false;done();}refresh();
  },()=>{if(first){first=false;done();}});};
 sub('likes',st.likes);sub('comments',st.cmts);
})();
</script>
