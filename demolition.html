<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>철거왕</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap">
<style>
:root{--acc:#ffc93c;--bg:#0f1218;--panel:#171b24;--line:#2a3040;--tx:#f3f4f7;--mut:#8d95a8;--good:#5be37d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--tx);font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;letter-spacing:-.2px;touch-action:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:5}
.money{background:rgba(10,12,18,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:8px 12px;min-width:120px}
.money small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.money b{font-size:22px;font-weight:900;color:var(--acc);font-variant-numeric:tabular-nums}
.stage{flex:1;background:rgba(10,12,18,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:8px 12px}
.stage .nm{display:flex;justify-content:space-between;font-size:13px;font-weight:800}.stage .nm span{color:var(--mut);font-weight:600}
.mis{font-size:11px;font-weight:700;color:#9fe08a;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mis.fail{color:#ff7a7a;text-decoration:line-through}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.1);margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8a3c,#ffc93c);transition:width .2s}
.ibtn{pointer-events:auto;width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(10,12,18,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--tx);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.ibtn.shop{background:var(--acc);color:#1a1300;border:0}
.combo{transition:opacity .2s,transform .15s!important;position:fixed;top:calc(84px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-weight:900;font-size:20px;color:#fff;text-shadow:0 2px 0 #c2410c,0 0 18px rgba(255,140,40,.8);pointer-events:none;opacity:0;transition:opacity .2s;z-index:5;white-space:nowrap}
.tools{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px;overflow-x:auto;z-index:5;background:linear-gradient(transparent,rgba(0,0,0,.55) 35%);scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{position:relative;flex:0 0 auto;width:62px;height:70px;border-radius:16px;border:1.5px solid rgba(255,255,255,.12);background:rgba(18,22,30,.85);color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:inherit;font-size:11px;font-weight:700;overflow:hidden;padding:0}
.tool svg{width:28px;height:28px}
.tool.on{border-color:var(--acc);background:rgba(60,46,10,.9);color:var(--acc)}
.tool.lock{opacity:.45}.tool.lock .lk{position:absolute;top:4px;right:5px;font-size:9px;color:var(--mut)}
.tool .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);height:0}
.tool .en{position:absolute;left:6px;right:6px;bottom:4px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;display:none}.tool .en i{display:block;height:100%;background:#ff4d6d}
.banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);font-size:46px;font-weight:900;color:#fff;letter-spacing:-1px;white-space:nowrap;z-index:9;pointer-events:none;text-shadow:0 4px 0 #b91c1c,0 0 30px rgba(255,120,30,.9);animation:bn 1.4s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes bn{0%{transform:translate(-50%,-50%) scale(2.6) rotate(-6deg);opacity:0}15%{transform:translate(-50%,-50%) scale(1) rotate(-3deg);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-70%) scale(.9) rotate(-3deg);opacity:0}}
.combo{animation:cp .25s}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(10,12,18,.9);border:1px solid var(--line);padding:12px 18px;border-radius:14px;font-weight:700;z-index:30;pointer-events:none;animation:tf 1.6s forwards;white-space:nowrap}
@keyframes tf{0%{opacity:0;transform:translate(-50%,-40%)}12%{opacity:1;transform:translate(-50%,-50%)}80%{opacity:1}100%{opacity:0}}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{width:100%;max-width:560px;max-height:86vh;background:var(--panel);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}.sh h2{margin:0;font-size:20px}.sh .m{color:var(--acc);font-weight:900;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;padding:4px 18px 10px}.tab{flex:1;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--mut);font-family:inherit;font-weight:800;font-size:14px}.tab.on{background:#232838;color:var(--tx)}
.list{overflow-y:auto;padding:0 14px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.item{display:flex;gap:12px;align-items:center;background:#1d2230;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.item .ic{width:48px;height:48px;border-radius:14px;background:#262c3c;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--acc)}.item .ic svg{width:28px;height:28px}
.item .tx{flex:1;min-width:0}.item b{font-size:15px}.item small{display:block;color:var(--mut);font-size:12px;margin-top:2px;line-height:1.4}
.buy{border:0;border-radius:12px;padding:10px 12px;font-family:inherit;font-weight:900;font-size:13px;background:var(--acc);color:#1a1300;min-width:84px;font-variant-numeric:tabular-nums}
.buy:disabled{background:#333a4a;color:#7c8497}
.ups{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.up{border:1px solid var(--line);border-radius:10px;padding:7px 4px;background:#151925;color:var(--tx);font-family:inherit;font-size:11px;font-weight:700;line-height:1.35}
.up em{display:block;font-style:normal;color:var(--acc);font-variant-numeric:tabular-nums}.up:disabled{opacity:.45}
.done{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5)}
.done.show{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:26px 22px;width:min(88vw,360px);text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.card h3{margin:0;font-size:15px;color:var(--mut);font-weight:700}.card .big{font-size:30px;font-weight:900;margin:6px 0 2px}
.card .bonus{font-size:26px;font-weight:900;color:var(--acc);margin:14px 0 4px;font-variant-numeric:tabular-nums}
.card .row{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);padding:6px 4px}.card .row b{color:var(--tx)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-family:inherit;font-weight:900;font-size:16px;margin-top:14px;background:var(--acc);color:#1a1300}
.btn.sub{background:#262c3c;color:var(--tx);margin-top:8px}
.hint{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(10,12,18,.8);padding:8px 14px;border-radius:20px;font-size:13px;color:#dfe3ec;pointer-events:none;z-index:4;white-space:nowrap;transition:opacity .4s}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="top">
  <div class="money"><small>보유 자금</small><b id="money">$0</b></div>
  <div class="stage"><div class="nm"><b id="bname">나무 오두막</b><span id="bstage">1단계</span></div><div class="bar"><i id="bprog"></i></div><div class="mis" id="mis"></div></div>
  <button class="ibtn shop" id="shopBtn" aria-label="상점"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16l-1.5 11a2 2 0 0 1-2 1.8H7.5a2 2 0 0 1-2-1.8z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg></button>
  <button class="ibtn" id="sndBtn" aria-label="소리"></button>
</div>
<div class="combo" id="combo"></div>
<div class="tools" id="tools"></div>
<div class="hint" id="hint">건물을 터치해서 부숴봐</div>

<div class="modal" id="shop"><div class="sheet">
  <div class="sh"><h2>상점</h2><span class="m" id="shopMoney"></span></div>
  <div class="tabs"><button class="tab on" data-tab="tools">도구</button><button class="tab" data-tab="global">보너스</button><button class="tab" data-tab="star">환생</button><button class="tab" data-tab="rec">기록</button></div>
  <div class="list" id="shopList"></div>
</div></div>

<div class="done" id="done"><div class="card">
  <h3>철거 완료</h3><div class="big" id="dName"></div>
  <div class="row"><span>파괴율</span><b id="dPct"></b></div>
  <div class="row"><span>최고 콤보</span><b id="dCombo"></b></div>
  <div class="row"><span>대피한 사람</span><b id="dEvac"></b></div>
  <div class="row"><span>미션</span><b id="dMis"></b></div>
  <div class="bonus" id="dBonus"></div><div style="color:var(--mut);font-size:13px">완료 보너스</div>
  <button class="btn" id="nextBtn">다음 건물로</button>
  <button class="btn sub" id="againBtn">이 건물 다시 짓기</button>
</div></div>

function unlockAudio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); MG=AC.createGain(); MG.gain.value=S.sound?.8:0; MG.connect(AC.destination); }catch(e){} } if(AC&&AC.state!=='running') AC.resume(); }
const lastS={}; function ok(k,ms){ const n=performance.now(); if(lastS[k]&&n-lastS[k]<ms) return false; lastS[k]=n; return true; }
function nz(d){ const n=AC.sampleRate*d, b=AC.createBuffer(1,n,AC.sampleRate), c=b.getChannelData(0); for(let i=0;i<n;i++) c[i]=Math.random()*2-1; const s=AC.createBufferSource(); s.buffer=b; return s; }
function en(g,t,a,r,p){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(p,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+r); }

function sfxBreak(m){ if(!ok('br',35)) return;
  if(m==='glass'){ noiseHit(5000,'highpass',.25,.5); for(let i=0;i<3;i++) setTimeout(()=>tone(3000+Math.random()*4000,'sine',.25,.08),i*30); }
  else if(m==='wood'){ noiseHit(900,'bandpass',.12,.7,2); tone(180,'triangle',.08,.25,90); }
  else if(m==='steel'){ tone(320,'triangle',.5,.18); tone(870,'sine',.4,.1); noiseHit(3000,'bandpass',.1,.3,3); }
  else { noiseHit(500,'lowpass',.3,.9); noiseHit(1800,'bandpass',.12,.3); tone(110,'sine',.12,.35,50); }
  if(ok('coin',90)) tone(1700+Math.random()*300,'sine',.08,.06,2400); }
function sfxBig(){ tone(55,'sine',.6,1,30); noiseHit(200,'lowpass',.5,.8); }
function sfxThud(v){ if(!ok('th',60)) return; noiseHit(300,'lowpass',.15,.5*v); }
function sfxHit(){ noiseHit(1200,'bandpass',.08,.5,1.5); tone(140,'sine',.1,.4,60); }
function sfxCannon(){ noiseHit(400,'lowpass',.4,1); tone(90,'sine',.3,.8,40); }
function sfxBoom(r){ if(!AC||!S.sound) return; const t=AC.currentTime, d=.6+r/300; const n=nz(d+.2), fl=AC.createBiquadFilter(); fl.type='lowpass'; fl.frequency.setValueAtTime(3000,t); fl.frequency.exponentialRampToValueAtTime(60,t+d); const g=AC.createGain(); en(g,t,.005,d,1); n.connect(fl); fl.connect(g); g.connect(MG); n.start(t); tone(70,'sine',d*.8,1,25); }
function sfxTick(){ tone(1400,'square',.03,.08); }
function sfxWhoosh(d){ if(!AC||!S.sound) return; const t=AC.currentTime, n=nz(d), fl=AC.createBiquadFilter(); fl.type='bandpass'; fl.Q.value=2; fl.frequency.setValueAtTime(400,t); fl.frequency.exponentialRampToValueAtTime(3000,t+d); const g=AC.createGain(); g.gain.setValueAtTime(.05,t); g.gain.linearRampToValueAtTime(.6,t+d); g.gain.linearRampToValueAtTime(.0001,t+d+.05); n.connect(fl); fl.connect(g); g.connect(MG); n.start(t); }
function sfxHole(){ tone(60,'sawtooth',3,.25,30); tone(120,'sine',3,.2,40); }
let laserNode=null; function sfxLaser(on){ if(!AC||!S.sound){ return; } if(on&&!laserNode){ const o=AC.createOscillator(), o2=AC.createOscillator(), g=AC.createGain(); o.type='sawtooth'; o.frequency.value=220; o2.type='square'; o2.frequency.value=663; g.gain.value=.08; o.connect(g); o2.connect(g); g.connect(MG); o.start(); o2.start(); laserNode={o,o2,g}; }
  else if(!on&&laserNode){ const n=laserNode; laserNode=null; n.g.gain.setTargetAtTime(0,AC.currentTime,.03); setTimeout(()=>{ n.o.stop(); n.o2.stop(); },200); }
  if(laserNode) laserNode.o.frequency.value=200+Math.random()*60; }
function sfxClick(){ tone(900,'sine',.05,.1); }
function sfxBuy(){ tone(880,'sine',.1,.2); setTimeout(()=>tone(1320,'sine',.15,.2),80); }
function sfxWin(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,'triangle',.25,.25),i*110)); }

  const fail=mission.fail||(mission.id==='time'&&missionT>mission.lim)||(mission.id==='evac'&&knocked>0); el.textContent='미션: '+mission.txt+st; el.className='mis'+(fail?' fail':''); }
/* ---- 기록 / 방치 / 환생 ---- */
S.rec=S.rec||{combo:0,hit:0,blocks:0,buildings:0,people:0}; S.crew=S.crew||0; S.stars=S.stars||0; S.run=S.run||0;
let chainMoney=0;
const STARMULT=()=>1+S.stars*.25;
const crewRate=()=>S.crew*3*(1+S.stage*.65)*BONUS();
const crewCost=()=>Math.floor(800*Math.pow(2,S.crew));
const starGain=()=>Math.floor(Math.sqrt(S.run/2e5));
setInterval(()=>{ if(S.crew){ const g=crewRate(); S.money+=g; S.total+=g; S.run+=g; } S.seen=Date.now(); },1000);
function offlineEarn(){ if(S.seen&&S.crew){ const sec=Math.min(8*3600,(Date.now()-S.seen)/1000); if(sec>30){ const g=sec*crewRate()*.5; S.money+=g; S.total+=g; S.run+=g; moneyShown=S.money; setTimeout(()=>toast(`자리 비운 동안 철거반이 ${fmt(g)} 벌었어`),600); } } S.seen=Date.now(); }
/* ---- 소리 추가 ---- */
function sfxScream(){ if(!AC||!S.sound||!ok('scream',350)) return; const t=AC.currentTime, o=AC.createOscillator(); o.type='sawtooth'; const f=700+Math.random()*400; o.frequency.setValueAtTime(f,t); o.frequency.linearRampToValueAtTime(f*1.4,t+.12); o.frequency.linearRampToValueAtTime(f*.8,t+.45);
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1500; bp.Q.value=3; const g=AC.createGain(); en(g,t,.02,.45,.18); o.connect(bp); bp.connect(g); g.connect(MG); o.start(t); o.stop(t+.55); }
function sfxThunder(){ noiseHit(4000,'highpass',.15,.9); setTimeout(()=>{ if(!AC||!S.sound) return; const t=AC.currentTime, n=nz(2.2), fl=AC.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=300; const g=AC.createGain(); en(g,t,.05,2,1); n.connect(fl); fl.connect(g); g.connect(MG); n.start(t); },80); }
function sfxRumble(){ noiseHit(90,'lowpass',.4,.9); }
function sfxWind(){ noiseHit(600,'bandpass',.7,.35,.8); }
function sfxRoar(){ if(!AC||!S.sound) return; const t=AC.currentTime; [80,83,160].forEach(f=>{ const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(f,t); o.frequency.linearRampToValueAtTime(f*1.6,t+.6); o.frequency.linearRampToValueAtTime(f*.7,t+1.6); const g=AC.createGain(); en(g,t,.1,1.5,.35); const fl=AC.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=900; o.connect(fl); fl.connect(g); g.connect(MG); o.start(t); o.stop(t+1.8); }); noiseHit(700,'bandpass',1.4,.5,1); }

/* ================= 시작 ================= */
window.addEventListener('resize',resize);
offlineEarn(); resize(); renderTools(); renderSnd(); buildStage();
if(S.total>0) hideHint();
requestAnimationFrame(step);
</script>
