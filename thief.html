<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>밤의 도둑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
/* VOICE: 조용하고 긴장감 있는 한밤의 잠입
   IDEA: 손전등 빛만 새어 나오는 어두운 저택 평면도
   PICTURE: 플레이어 주변만 밝은 탑뷰 저택, 경비의 노란 시야 부채꼴
   COLOUR and TYPE: 밤색 남보라 바탕, 손전등 노랑, 발각 빨강, 보석 청록 / Do Hyeon
   LAYOUT: 상단 상태바, 전체 화면 캔버스, 왼쪽 조이스틱, 오른쪽 도구 버튼 */
:root{--bg:#0d0b14;--ink:#efe9ff;--dim:#9b92b5;--lamp:#ffd866;--red:#ff4b5c;--gem:#4fe3e0;--pan:#1b1726e6}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 'Do Hyeon',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(#0d0b14f0,#0d0b1400);pointer-events:none}
#row{display:flex;align-items:center;gap:12px;font-size:16px;padding-right:46px}
#row span{white-space:nowrap}
#gemS.on{color:var(--gem)}
#gw{margin-top:6px;height:8px;border-radius:4px;background:#ffffff1a;overflow:hidden;max-width:55%}
#sw{margin-top:4px;height:6px;border-radius:3px;background:#ffffff1a;overflow:hidden;max-width:40%}
#sb{height:100%;width:100%;background:#6fdc8c}
#sb.ex{background:#ff9a3d}
#gb{height:100%;width:0;background:var(--red);transition:width .08s}
.circ{position:fixed;top:calc(8px + env(safe-area-inset-top));right:12px;width:38px;height:38px;border-radius:50%;border:1px solid #ffffff2a;background:var(--pan);display:grid;place-items:center;padding:0;z-index:12}
.circ svg{width:20px;height:20px}
#tools{touch-action:none;position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,64px);gap:10px}
.tb{touch-action:none;position:relative;width:64px;height:64px;border-radius:50%;border:2px solid #ffffff22;background:var(--pan);font-size:15px;padding:0}
.tb span{position:absolute;right:-2px;top:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--lamp);color:#1a1400;font-size:13px;line-height:22px}
.tb.on{border-color:var(--lamp);background:#3d321a}
.tb.no{opacity:.35}
#steal{position:fixed;right:12px;bottom:calc(166px + env(safe-area-inset-bottom));width:138px;height:52px;border-radius:26px;border:2px solid var(--lamp);background:#3d321ae6;color:var(--lamp);font-size:19px}
#toast{position:fixed;left:50%;top:78px;transform:translateX(-50%);background:#000c;padding:7px 16px;border-radius:20px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:11}
#toast.on{opacity:1}
.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9;background:#07050cb8}
.box{background:#1b1726f2;border:1px solid #ffffff14;border-radius:18px;padding:24px 22px;max-width:380px;width:100%;max-height:calc(100dvh - 40px);overflow-y:auto}
#menu{background:radial-gradient(ellipse at 50% 38%,#07050c40,#07050cee 70%);flex-direction:column}
#menu h1{margin:0;font-weight:400;font-size:clamp(46px,14vw,64px);line-height:1;color:var(--lamp);text-shadow:0 0 30px #ffd86655}
#menu .sub{color:var(--dim);margin:10px 0 34px;font-size:17px}
#menu .play{width:220px;min-height:60px;border:0;border-radius:30px;background:var(--lamp);color:#1a1400;font-size:26px;box-shadow:0 8px 30px #ffd86640}
#menu .ghost{margin-top:12px;width:220px;min-height:46px;border:1px solid #ffffff30;border-radius:23px;background:transparent;font-size:17px}
#menu .best{margin-top:22px;color:var(--dim)}
.box h2{margin:0 0 10px;font-weight:400;font-size:32px;text-align:center;line-height:1.1}
.box p{margin:7px 0;color:var(--dim);font-size:15px}
.box .c{text-align:center;color:var(--ink);font-size:17px}
.box .big{margin-top:16px;width:100%;min-height:50px;border:0;border-radius:12px;background:var(--lamp);color:#1a1400;font-size:20px}
.box .sec{margin-top:10px;width:100%;min-height:46px;border:1px solid #ffffff30;border-radius:12px;background:transparent;font-size:17px}
.set{margin:14px 0}
.set label{display:block;margin-bottom:6px;font-size:16px}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;border:1px solid #ffffff22;border-radius:10px;background:#2a2338;font-size:15px}
.seg button.on{background:var(--lamp);color:#1a1400;border-color:var(--lamp)}
.tb.run{background:#3a1f24e6;border-color:#ff4b5c88;font-size:16px}
.tb.run.on{background:#ff4b5c;color:#fff;border-color:#ff4b5c}
.tb.q{font-size:14px;line-height:1.15}
.tb.q small{display:block;color:var(--dim);font-size:11px}
#hpS{display:flex;gap:4px;margin-left:auto}
#hpS i{width:14px;height:14px;border-radius:3px;background:var(--red)}
#hpS i.off{background:#ffffff22}
#gw{position:relative}
#gw.al #gb{animation:fl .4s infinite alternate}
@keyframes fl{to{background:#ffd866}}
.bag{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #ffffff12}
.bag .nm{flex:1;font-size:17px}.bag .nm small{display:block;color:var(--dim);font-size:13px}
.bag button{width:52px;min-height:44px;border:1px solid #ffffff22;border-radius:10px;background:#2a2338;font-size:14px}
.bag button.on{background:var(--lamp);color:#1a1400}
.bag button:disabled{opacity:.35}
.grade{font-size:84px;line-height:1;text-align:center;color:var(--lamp);margin:4px 0 8px}
.grade.gS{color:var(--gem);text-shadow:0 0 24px #4fe3e088}.grade.gD{color:var(--dim)}
.shop h3{margin:14px 0 2px;font-weight:400;font-size:18px;color:var(--lamp)}
#misS{margin-top:5px;font-size:13px;color:var(--dim)}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hidden">
  <div id="row"><span id="flS">1층</span><span id="scS">돈 0</span><span id="gemS">보석 없음</span><span id="hpS"></span></div>
  <div id="gw"><div id="gb"></div></div>
  <div id="sw"><div id="sb"></div></div>
  <div id="misS"></div>
</div>
<button id="pauseBtn" class="circ hidden" aria-label="일시정지"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
<button id="steal" class="hidden">훔치기</button>
<div id="tools" class="hidden">
  <button class="tb q" id="q0"></button>
  <button class="tb q" id="q1"></button>
  <button class="tb" id="bagBtn">가방</button>
  <button class="tb run" id="runBtn">달리기</button>
</div>
<div id="toast"></div>

<div id="menu" class="scr">
  <button id="setBtn" class="circ" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="7.5" stroke-width="4" stroke-dasharray="2.9 3"/><circle cx="12" cy="12" r="5" stroke-width="2.2"/></svg></button>
  <h1>밤의 도둑</h1>
  <div class="sub">경비의 눈을 피해 보석을 훔쳐라</div>
  <button class="play" id="playBtn">플레이</button>
  <button class="ghost" id="howBtn">게임 방법</button>
  <div class="best" id="bestS">최고 점수 0</div>
</div>
<div id="ov" class="scr hidden"></div>

<script>
{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const PAL=['#5e4634','#55425a','#465445','#614f39','#4d4256','#5a3f3f'];
const ACT={phone:{d:[5,8],r:1.6,h:.35,txt:'...'},smoke:{d:[5,7],r:2.4,h:.45,txt:'후~'},snack:{d:[4,6],r:2,h:.4,txt:'냠냠'},doze:{d:[6,9],r:.9,h:.3,txt:'zz'},
 shoe:{d:[2,3.5],r:1,h:.5,txt:'끈이...'},stretch:{d:[2,3],r:3,h:.7,txt:'으아~'},wall:{d:[3,5],r:3.6,h:.5,txt:'흠...'},chat:{d:[6,9],r:2.4,h:.5,txt:'블라블라'},wait:{d:[4,4],r:3,h:.6,txt:''}};
const PERS={lazy:{c:'#3d5a8c',dist:.65,rg:-.6,sp:.85,gl:1.6},normal:{c:'#2d4c94',dist:.35,rg:0,sp:1,gl:1},sharp:{c:'#24357a',dist:.12,rg:.9,sp:1.1,gl:.55},sentry:{c:'#2b4470',dist:.2,rg:.4,sp:1,gl:.8},police:{c:'#161a28',dist:.08,rg:.7,sp:1.15,gl:.6},captain:{c:'#6a1f24',dist:0,rg:2,sp:1.05,gl:.5}};
const RANGE={stone:6.5,smoke:5.5,dart:6,gun:7,sil:7,hook:4.5};
const NAME={stone:'돌',smoke:'연막',dart:'수면침',box:'상자',gun:'총',sil:'소음기 총',hook:'갈고리',hammer:'망치',fake:'가짜 보석'};
const PASSIVE=['hammer','fake'];
const DESC={stone:'던진 곳으로 경비 유인',smoke:'던진 곳 시야 차단',dart:'맞은 경비를 재움',box:'쓰고 가만히 있으면 안 보임',gun:'경비 기절, 대신 소리가 큼',sil:'조용히 기절시킴',hook:'벽 너머로 이동',hammer:'유리 진열장 깨기 (자동)',fake:'보석 바꿔치기 (자동)'};
let doors=[],creak=new Set(),vents=[],lasers=[],paints=[],dogs=[],trail=[],trailT=0,lastTile=-1,mission=null,stats={ko:0,alarms:0,art:0,pick:0},money=0,up={stam:0,hp:0,spd:0,quiet:0},chan=null,curAct=null,floorT=0,lootTot=0,lootGot=0,captain=null,civs=[],furn=[],rugs=[],VW,VH,S,W,H,map,rid,rooms,P,guards,cams,items,exitT,smokes,proj,fx,gauge,score,floorN,hasGem,inv,phase='menu',time=0,noiseT=0,radioT=0,aim=null,stealG=null,camX=0,camY=0,back='menu',alarm=false,hideT=0,hp=3,quick=[null,null],bullets=[],invul=0,runHeld=false,stam=100,exh=false,stamD=0,shake=0;
let SET={diff:1,joy:1,fixed:0,mini:1};
try{Object.assign(SET,JSON.parse(localStorage.getItem('thief_set')||'{}'))}catch(e){}
const saveSet=()=>{try{localStorage.setItem('thief_set',JSON.stringify(SET))}catch(e){}};
const getBest=()=>{try{return +localStorage.getItem('thief_best')||0}catch(e){return 0}};
const joyR=()=>[44,56,70][SET.joy];
const diffMul=()=>[.7,1,1.35][SET.diff];
const maxStam=()=>100*(1+.25*up.stam),hpMax=()=>3+up.hp,spdMul=()=>1+.07*up.spd;
const roomAt=(x,y)=>{const r=rid[Math.floor(y)]&&rid[Math.floor(y)][Math.floor(x)];return r>=0?rooms[r]:null};
const fmtT=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
function gain(v,loot=true){score+=v;money+=v;if(loot)lootGot+=v;hud()}

// ---------- 저택 생성 ----------
function gen(n){
 W=Math.min(42,12+n*4);H=Math.min(62,17+n*5);
 map=[];rid=[];for(let y=0;y<H;y++){map.push(new Array(W).fill(0));rid.push(new Array(W).fill(-1))}
 rooms=[];
 const carve=(x,y,id)=>{if(x>0&&y>0&&x<W-1&&y<H-1){map[y][x]=1;if(id!=null)rid[y][x]=id}};
 const corridor=(a,b)=>{let x=a.cx,y=a.cy;const hz=()=>{while(x!==b.cx){x+=Math.sign(b.cx-x);carve(x,y);carve(x,y+1)}},vt=()=>{while(y!==b.cy){y+=Math.sign(b.cy-y);carve(x,y);carve(x+1,y)}};if(Math.random()<.5){hz();vt()}else{vt();hz()}};
 const split=(x,y,w,h,d)=>{
  const sx=w>=14,sy=h>=14;
  if((!sx&&!sy)||d>5||(d>2&&Math.random()<.2)){
   const rw=rnd(5,w-2),rh=rnd(5,h-2),rx=x+1+rnd(0,w-2-rw),ry=y+1+rnd(0,h-2-rh);
   const r={x:rx,y:ry,w:rw,h:rh,cx:rx+(rw>>1),cy:ry+(rh>>1),id:rooms.length,c:PAL[rooms.length%PAL.length],lv:-99};rooms.push(r);
   for(let j=ry;j<ry+rh;j++)for(let i=rx;i<rx+rw;i++)carve(i,j,r.id);
   return[r];
  }
  let A,B;
  if(sx&&(w>=h||!sy)){const p=rnd(7,w-7);A=split(x,y,p,h,d+1);B=split(x+p,y,w-p,h,d+1)}
  else{const p=rnd(7,h-7);A=split(x,y,w,p,d+1);B=split(x,y+p,w,h-p,d+1)}
  corridor(A[rnd(0,A.length-1)],B[rnd(0,B.length-1)]);
  return A.concat(B);
 };
 split(0,0,W,H,0);
 decorate();
 const start=rooms[rnd(0,rooms.length-1)];
 P={x:start.cx+.5,y:start.cy+.5,fx:0,fy:1,vx:0,vy:0,box:false,moving:false,run:false};
 const dist=bfs(start.cx,start.cy);
 const far=rooms.filter(r=>r!==start).map(r=>({r,d:dist[r.cy][r.cx]})).sort((a,b)=>b.d-a.d).map(o=>o.r);
 const exitR=far[0]||start,gemR=far[1]||exitR,vaultR=far.length>3?far[2+rnd(0,Math.min(2,far.length-3))]:null;
 const et=tileIn(exitR);exitT={x:et[0]+.5,y:et[1]+.5};
 items=[{t:'gem',x:gemR.cx+.5,y:gemR.cy+.5}];
 if(vaultR)for(let i=0;i<3;i++){const t=tileIn(vaultR);items.push({t:'bar',x:t[0]+.5,y:t[1]+.5})}
 rooms.forEach(r=>{if(r===start)return;for(let i=rnd(0,2);i>0;i--){const t=tileIn(r);items.push({t:'coin',x:t[0]+.5,y:t[1]+.5})}});
 const kinds=['stone','stone','smoke','dart'];
 for(let i=0;i<1+Math.floor(n/2);i++){const r=far[rnd(0,far.length-1)]||start,t=tileIn(r);items.push({t:kinds[rnd(0,3)],x:t[0]+.5,y:t[1]+.5})}
 if(inv&&!inv.box&&Math.random()<.5){const r=far[rnd(0,far.length-1)]||start,t=tileIn(r);items.push({t:'box',x:t[0]+.5,y:t[1]+.5})}
 guards=[];const gc=Math.min(13,1+n+Math.floor(n/2));
 const pool=['stone','stone','stone','smoke','dart','dart','coin','coin'];
 for(let i=0;i<gc;i++){
  const r=(i===0&&vaultR)?vaultR:far[rnd(0,Math.max(0,Math.min(far.length-1,3+n)))]||far[0]||start;
  let t=tileIn(r),k=0;while(dist[t[1]][t[0]]<Math.min(8,3+n*2)&&k++<20)t=tileIn(r);
  const loot=[pool[rnd(0,7)]];if(Math.random()<.4)loot.push(pool[rnd(0,7)]);if(Math.random()<.08)loot.push('box');
  guards.push({x:t[0]+.5,y:t[1]+.5,a:Math.random()*6.28,path:[],st:'look',t:1+Math.random()*2,lt:0,lb:0,alertT:0,sleepT:0,rep:0,sees:false,noticed:false,
   home:i===0&&vaultR?vaultR:null,loot,pers:['lazy','normal','normal','sharp','sentry'][rnd(0,4)],post:{x:t[0]+.5,y:t[1]+.5},act:'phone',chatW:null,gun:false,fireCd:1,stun:0,gl:0,glT:3+Math.random()*5,sp:[],last:null,pred:false,bubble:0});
 }
 {const k=Math.min(3,Math.floor((n+1)/2)),ord=guards.map((g,i)=>i).sort(()=>Math.random()-.5);ord.slice(0,k).forEach(i=>guards[i].gun=true)}
 if(n>=5){const k=Math.min(3,1+Math.floor((n-5)/2));guards.filter(g=>!g.home).sort(()=>Math.random()-.5).slice(0,k).forEach(g=>{g.pers='police';g.gun=true;g.taser=true;g.tzCd=0})}
 civs=[];const cc=n>=3?Math.min(4,Math.floor((n-1)/2)):0;
 for(let i=0;i<cc;i++){const r=far[rnd(0,far.length-1)]||start,t=tileIn(r);civs.push({x:t[0]+.5,y:t[1]+.5,a:Math.random()*6.28,path:[],st:'look',t:2,lt:0,lb:0,see:0,sleepT:0,wp:0,mv:0,col:['#c76b8a','#6bb0c7','#c7a46b','#8ac76b'][i%4],hair:['#2a1a10','#d9b45a','#5a3a24','#111'][rnd(0,3)]})}
 cams=[];
 if(n>=2)for(let i=0;i<Math.min(4,n-1);i++){
  const r=far[rnd(0,far.length-1)];if(!r)break;const cx=[r.x,r.x+r.w-1][rnd(0,1)],cy=[r.y,r.y+r.h-1][rnd(0,1)];
  cams.push({x:cx+.5,y:cy+.5,base:Math.atan2(r.cy-cy,r.cx-cx),a:0,ph:Math.random()*6,cd:0,sees:false});
 }
 cams=cams.filter(c=>map[Math.floor(c.y)][Math.floor(c.x)]===1);
 floorT=0;stats={ko:0,alarms:0,art:0,pick:0};chan=null;trail=[];lastTile=-1;if(inv)inv.key=0;
 // 잠긴 방
 doors=[];
 const lockRoom=r=>{if(!r||r===start)return;const ds=[];for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++){if(map[y][x]!==1)continue;if(D4.some(([dx,dy])=>map[y+dy]&&map[y+dy][x+dx]===1&&rid[y+dy][x+dx]===-1))ds.push([x,y])}
  if(!ds.length)return;ds.forEach(([x,y])=>map[y][x]=4);const d2=bfs(start.cx,start.cy);
  if((exitR!==r&&d2[Math.floor(exitT.y)][Math.floor(exitT.x)]===Infinity)||(gemR!==r&&d2[gemR.cy][gemR.cx]===Infinity)){ds.forEach(([x,y])=>map[y][x]=1);return}
  ds.forEach(([x,y])=>doors.push({x,y,t:0,unl:false,r}))};
 if(vaultR)lockRoom(vaultR);if(n>=2&&Math.random()<.6)lockRoom(gemR);
 // 불 스위치, 삐걱 바닥
 rooms.forEach(r=>{r.dark=false;r.fix=null;const c=[];for(let x=r.x;x<r.x+r.w;x++)if(map[r.y][x]===1&&map[r.y-1][x]===0)c.push([x,r.y]);r.sw=c.length?c[rnd(0,c.length-1)]:null});
 creak=new Set();if(n>=2)for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(map[y][x]===1&&Math.random()<.045)creak.add(y*W+x);
 // 환풍구
 vents=[];if(n>=2)for(let i=0;i<Math.min(3,1+Math.floor(n/3));i++){const a=rooms[rnd(0,rooms.length-1)],b=rooms[rnd(0,rooms.length-1)];if(a===b)continue;vents.push({a:tileIn(a),b:tileIn(b)})}
 // 레이저
 lasers=[];if(n>=3){const rows=[];for(let y=gemR.y;y<gemR.y+gemR.h;y++)if(Math.abs(y-gemR.cy)>=1)rows.push(y);rows.sort(()=>Math.random()-.5);
  rows.slice(0,Math.min(rows.length,n>=6?3:2)).forEach(y=>lasers.push({y,x0:gemR.x,x1:gemR.x+gemR.w-1,ph:Math.random()*3,per:2.4+Math.random()*1.4}))}
 // 그림
 paints=[];{const c=[];rooms.forEach(r=>{if(r===start)return;for(let x=r.x;x<r.x+r.w;x++)if(map[r.y][x]===1&&map[r.y-1][x]===0&&!(r.sw&&r.sw[0]===x))c.push([x,r.y])});
  c.sort(()=>Math.random()-.5);c.slice(0,3+Math.floor(n/2)).forEach(([x,y])=>paints.push({x,y,taken:false,c:rnd(0,4)}))}
 // 경비견

function bfs(sx,sy){const d=map.map(r=>r.map(()=>Infinity)),q=[[sx,sy]];d[sy][sx]=0;
 while(q.length){const[x,y]=q.shift();for(const[dx,dy]of D4){const nx=x+dx,ny=y+dy;if(map[ny]&&map[ny][nx]===1&&d[ny][nx]===Infinity){d[ny][nx]=d[y][x]+1;q.push([nx,ny])}}}return d}
function path(sx,sy,tx,ty){
 if(!map[ty]||!(map[ty][tx]===1||map[ty][tx]===4))return[];
 const par=new Map(),k=(x,y)=>y*W+x,q=[[sx,sy]];par.set(k(sx,sy),null);
 while(q.length){const[x,y]=q.shift();if(x===tx&&y===ty)break;
  for(const[dx,dy]of D4){const nx=x+dx,ny=y+dy;if(map[ny]&&(map[ny][nx]===1||map[ny][nx]===4)&&!par.has(k(nx,ny))){par.set(k(nx,ny),[x,y]);q.push([nx,ny])}}}
 if(!par.has(k(tx,ty)))return[];
 const out=[];let c=[tx,ty];while(c){out.unshift(c);c=par.get(k(c[0],c[1]))}return out;
}

const wall=(x,y)=>{x=Math.floor(x);y=Math.floor(y);return x<0||y<0||x>=W||y>=H||map[y][x]!==1};

function adiff(a,b){let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d}

function toMenu(){phase='menu';gameUI(false);hideOv();gen(2);camX=guards[0].x;camY=guards[0].y;$('bestS').textContent='최고 점수 '+getBest();$('menu').classList.remove('hidden')}
function newFloor(){gen(floorN);hp=hpMax();stam=maxStam();exh=false;phase='play';hideOv();$('menu').classList.add('hidden');gameUI(true);hud();toast(captain?floorN+'층: 경비대장이 지키는 저택!':floorN+'층 저택: 보석을 훔쳐 탈출하세요')}
function newGame(){floorN=1;score=0;money=0;up={stam:0,hp:0,spd:0,quiet:0};inv={stone:0,smoke:0,dart:0,box:0,gun:0,sil:0,hook:0,hammer:0,fake:0,key:0};quick=[null,null];newFloor()}
function win(){phase='clear';$('steal').classList.add('hidden');const n=floorN,par=60+n*25,t=floorT,lf=lootTot?Math.min(1,lootGot/lootTot):1;
 const v=40*lf+Math.max(0,30-12*stats.alarms)+Math.max(0,10-3*stats.ko)+20*Math.max(0,Math.min(1,(par*1.6-t)/(par*.8)));
 const gi=v>=85?0:v>=70?1:v>=55?2:v>=40?3:4,G='SABCD'[gi],gb=Math.round([600,400,250,100,0][gi]*(1+n*.2)),eb=300*n,md=missionDone(),mb=md?Math.round(300+150*n):0;
 gain(eb+gb+mb,false);
 show(`<h2>탈출 성공</h2><div class="grade g${G}">${G}</div><p class="c">${n}층 · ${fmtT(t)} · 경보 ${stats.alarms}회 · 기절 ${stats.ko}명<br>훔친 비율 ${Math.round(lf*100)}%</p>
 <p>탈출 보너스 +${eb}<br>등급 보너스 +${gb}<br>의뢰 「${mission.t}」 ${md?'성공 +'+mb:'실패'}</p><p class="c">가진 돈 ${money}</p><button class="big" id="nx">은신처로</button>`);
 $('nx').onclick=shop}
function fail(){phase='dead';joy.id=null;joy.x=joy.y=0;aim=null;$('steal').classList.add('hidden');
 const best=Math.max(score,getBest());try{localStorage.setItem('thief_best',best)}catch(e){}
 show(`<h2 style="color:var(--red)">붙잡혔다!</h2><p class="c">${floorN}층에서 체포됐어요<br>점수 ${score} · 최고 ${best}</p><button class="big" id="rt">처음부터 다시</button><button class="sec" id="mn">메뉴로</button>`);
 $('rt').onclick=newGame;$('mn').onclick=toMenu}
function pause(){if(phase!=='play')return;phase='pause';joy.id=null;joy.x=joy.y=0;
 show(`<h2>일시정지</h2><button class="big" id="cont">계속하기</button><button class="sec" id="pset">설정</button><button class="sec" id="pmenu">메뉴로</button>`);
 $('cont').onclick=()=>{phase='play';hideOv()};$('pset').onclick=()=>settings('pause');$('pmenu').onclick=toMenu}
function settings(from){back=from;
 const seg=(k,opts)=>`<div class="seg">${opts.map((o,i)=>`<button data-k="${k}" data-v="${i}" class="${SET[k]===i?'on':''}">${o}</button>`).join('')}</div>`;
 show(`<h2>설정</h2>
 <div class="set"><label>난이도 (발각 속도)</label>${seg('diff',['쉬움','보통','어려움'])}</div>
 <div class="set"><label>조이스틱 크기</label>${seg('joy',['작게','보통','크게'])}</div>
 <div class="set"><label>조이스틱 위치</label>${seg('fixed',['누른 곳','왼쪽 아래 고정'])}</div>
 <div class="set"><label>미니맵</label>${seg('mini',['끄기','켜기'])}</div>
 <button class="big" id="sback">확인</button>`);
 $('ov').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{SET[b.dataset.k]=+b.dataset.v;saveSet();b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
 $('sback').onclick=()=>{if(back==='pause'){phase='play';pause()}else hideOv()};
}
function how(){
 show(`<h2>게임 방법</h2>
 <p>왼쪽 화면을 누르고 끌면 조이스틱으로 조용히 걸어요. 달리기 버튼을 누르고 있으면 훨씬 빨라지지만 스태미나를 쓰고 발소리에 경비가 와요.</p>
 <p>노란 부채꼴이 경비 시야예요. 안에 있으면 발각 게이지가 차고, 가득 차면 경보! 총 든 경비는 쏘고 나머지는 쫓아와요. 총알을 피하고 시야에서 8초 벗어나면 따돌려요. 체력 3칸이 다 닳으면 체포. 반쯤 차면 경비가 쫓아오고 무전으로 동료를 불러요. 놓치면 내가 도망간 방향을 예상해서 수색해요.</p>
 <p>처음엔 맨손이에요. 경비가 폰 보기, 담배, 간식, 졸기, 신발끈, 수다 떨기처럼 한눈팔 때나 등 뒤로 몰래 다가가면 훔치기 버튼이 떠요. 허리춤에 주머니가 보이는 경비가 뭔가 갖고 있고, 총 든 경비는 총을 뺏을 수 있어요. 가끔 뒤를 휙 돌아보니 조심하세요.</p>
 <p>얻은 도구는 가방에 들어가고, 퀵 칸 2개에 장착해서 써요. 돌, 연막, 수면침, 총은 퀵 버튼을 누른 채로 조이스틱처럼 끌어서 조준하고, 떼면 던져요. 가운데로 돌려놓고 떼면 취소돼요. 조준하는 동안은 시간이 느려져요. 상자는 쓰고 가만히 있으면 안 보이지만 경계 중인 경비가 바로 옆에 오면 의심해요.</p>
 <p>경비마다 성격이 있어요. 게으른 경비(밝은 파랑)는 자주 딴짓하고, 예리한 경비(진한 남색)는 시야가 길고 자주 뒤돌아봐요. 보초는 한자리를 지켜요.</p>
 <p>3층부터는 주민(분홍 시야)이 돌아다녀요. 나를 보면 소리 지르고 가장 가까운 경비한테 달려가 신고해요. 5층부터는 경찰(검은 제복, 금색 배지)이 나와요. 경찰은 항상 총을 들고, 가까이 오면 테이저건을 쏘는데 맞으면 스태미나가 바로 바닥나요.</p>
 <p>상호작용 버튼 하나로 다 해요: 잠긴 문(열쇠 든 경비를 털거나 3초간 자물쇠 따기), 불 끄기(어두운 방은 경비 시야 절반, 경비가 와서 다시 켬), 환풍구(다른 방으로 몰래 이동), 관제 단말기(카메라 전부 끄기), 벽에 걸린 그림, 유리 진열장(망치 필요), 잠든 경비의 옷 뺏기(변장: 멀리선 안 들킴)와 끌어서 옷장·책장에 숨기기.</p>
 <p>삐걱이는 바닥은 살짝 줄무늬가 보여요. 4층부터 경비견이 냄새로 발자취를 쫓아와요(상자로는 못 속이고 연막이 냄새를 지워요). 3층부터 보석 방엔 깜빡이는 레이저가 있고, 보석을 그냥 집으면 경보가 울려요(가짜 보석으로 바꿔치기). 5층마다 경비대장이 무전으로 전체를 지휘해요.</p>
 <p>탈출하면 등급(S~D)과 의뢰 보너스를 받고, 은신처에서 도구를 사고 업그레이드해요.</p>
 <p>보석(청록)을 훔쳐 출구(빨강)로 탈출하세요. 금괴가 있는 금고 방엔 경비가 붙어 있어요.</p>
 <button class="big" id="hok">알겠어요</button>`);
 $('hok').onclick=hideOv;
}
$('playBtn').onclick=newGame;$('howBtn').onclick=how;$('setBtn').onclick=()=>settings('menu');$('pauseBtn').onclick=pause;
function resize(){const d=window.devicePixelRatio||1;VW=innerWidth;VH=innerHeight;cv.width=VW*d;cv.height=VH*d;ctx.setTransform(d,0,0,d,0,0);S=Math.max(26,Math.min(VW/10,VH/15))}
window.addEventListener('resize',resize);resize();
let last=performance.now();
function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;
 if(phase==='play'){step(aim?dt*.35:dt);$('gb').style.width=gauge*100+'%';$('sb').style.width=stam/maxStam()*100+'%';if(Math.floor(time*2)!==Math.floor((time-dt)*2))misHud();$('sb').classList.toggle('ex',exh)}else if(phase==='menu')demoStep(dt);else time+=dt;
 draw();requestAnimationFrame(loop)}
toMenu();
requestAnimationFrame(loop);
}
</script>
