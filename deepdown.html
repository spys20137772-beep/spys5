<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>딥다운 — 광산 방치형</title>
<style>
:root{--bg:#0c0a10;--panel:#16131c;--panel2:#1d1925;--line:#2b2634;--txt:#efe8da;--dim:#938a9c;--gold:#ffd04d;--acc:#ff9440;--fos:#86e0cf;--red:#ff5a4f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:540px;margin:0 auto;position:relative;background:var(--bg)}
#top{padding:9px 12px 7px;padding-top:max(9px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:linear-gradient(#17131d,#110e15)}
.tr{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#gold{font-size:24px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
#fos{font-weight:800;color:var(--fos);font-size:15px}
.sub{font-size:12px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.sub b{color:var(--txt);font-weight:700}
.sub .warn{color:var(--red);font-weight:800}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#nav{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:3}
#nav button{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(12,10,16,.7);color:#fff;font-size:17px;font-weight:900;font-family:inherit}
#banner{position:absolute;left:50%;top:14%;transform:translate(-50%,0);opacity:0;pointer-events:none;padding:10px 20px;border-radius:12px;background:rgba(10,8,14,.92);border:2px solid #fff;text-align:center;white-space:nowrap;z-index:4}
#banner.show{animation:ban 2.8s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,0) scale(.5)}10%{opacity:1;transform:translate(-50%,0) scale(1.12)}18%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px) scale(1)}}
#banner .k{font-size:11px;letter-spacing:3px;font-weight:800;opacity:.85}
#banner .n{font-size:22px;font-weight:900;margin-top:2px}
#sheet{position:absolute;left:0;right:0;bottom:0;height:62%;background:var(--bg);border-top:1px solid #3a3346;border-radius:16px 16px 0 0;display:none;flex-direction:column;z-index:5;box-shadow:0 -10px 30px rgba(0,0,0,.5)}
#sheet.open{display:flex}
#grab{height:22px;display:flex;align-items:center;justify-content:center;flex:0 0 22px}
#grab i{width:40px;height:4px;border-radius:2px;background:#3a3346}
#panel{flex:1;overflow-y:auto;padding:2px 10px 18px;-webkit-overflow-scrolling:touch}
#tabs{display:flex;border-top:1px solid var(--line);background:#120f17;padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;padding:11px 0 10px;background:none;border:none;color:var(--dim);font-size:13px;font-weight:800;border-top:2px solid transparent;font-family:inherit}
#tabs button.on{color:var(--txt);border-top-color:var(--acc)}
.row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.row.tap{cursor:pointer}
.ic{width:40px;height:40px;flex:0 0 40px;border-radius:10px;display:grid;place-items:center;font-size:21px;background:var(--panel2);border:1px solid var(--line)}
.info{flex:1;min-width:0}
.nm{font-weight:800;font-size:14px}
.nm small{font-weight:700;color:var(--acc);font-size:12px;margin-left:4px}
.ds{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.4}
.buy{min-width:84px;padding:9px 8px;border-radius:9px;border:none;background:var(--acc);color:#1b0f04;font-weight:900;font-size:13px;font-family:inherit;line-height:1.2}
.buy small{display:block;font-size:11px;font-weight:700;opacity:.8}
.buy:disabled{background:#2c2733;color:#6f667a}
.buy.fos{background:var(--fos);color:#06201b}
.buy.fos:disabled{background:#2c2733;color:#6f667a}
.buy.sm{min-width:52px;padding:7px 6px;font-size:12px}
.buy.gh{background:#2c2733;color:var(--txt)}
.hd{font-size:12.5px;color:var(--dim);margin:2px 2px 10px;line-height:1.55}
.hd b{color:var(--txt)}
.sect{font-size:13px;font-weight:900;color:var(--acc);margin:12px 2px 8px;letter-spacing:.3px}
.sect.f{color:var(--fos)}
.pr{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line)}
.sw{width:16px;height:16px;border-radius:4px;flex:0 0 16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.pr .t{font-size:14px;font-weight:800}
.pr .t span{font-size:11.5px;color:var(--dim);font-weight:600}
.pct{font-weight:900;font-variant-numeric:tabular-nums;font-size:14px;min-width:60px;text-align:right}
.bar{height:4px;border-radius:2px;background:#2a2532;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;background:#221e2b;border-radius:6px;padding:2px 6px;font-variant-numeric:tabular-nums}
.chip i{width:9px;height:9px;border-radius:2px;display:inline-block}
.chip.no{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.gem{width:34px;height:34px;margin:2px auto 8px;border-radius:7px;transform:rotate(45deg) scale(.8);box-shadow:inset -6px -6px 0 rgba(0,0,0,.28),inset 5px 5px 0 rgba(255,255,255,.3)}
.card .nm{font-size:13px}.card .ds{font-size:11px}
.big{width:100%;padding:13px;border-radius:12px;border:none;background:linear-gradient(90deg,#ff7a3d,#ff4f6d);color:#fff;font-weight:900;font-size:15px;font-family:inherit;margin:2px 0 10px}
.big.alt{background:linear-gradient(90deg,#3d8bff,#46c9b4)}
.big:disabled{background:#2c2733;color:#6f667a}
.reset{display:block;margin:22px auto 0;background:none;border:1px solid var(--line);color:var(--dim);padding:8px 14px;border-radius:8px;font-family:inherit;font-size:12px}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
#modal.show{display:flex}
.mbox{width:100%;max-width:390px;max-height:88%;overflow-y:auto;background:#17131d;border:1px solid #3a3346;border-radius:16px;padding:16px}
.mbox h2{font-size:18px;margin-bottom:6px}
.mbox p{font-size:13px;color:var(--dim);line-height:1.5;margin-bottom:6px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.mrow .l{display:flex;align-items:center;gap:8px}
.mbtns{display:flex;gap:8px;margin-top:14px}
.mbtns button{flex:1;padding:12px;border-radius:10px;border:none;font-weight:900;font-family:inherit;font-size:14px;background:var(--acc);color:#1b0f04}
.mbtns button.ghost{background:#2c2733;color:var(--txt)}
.slot{margin:10px 0 4px;font-size:12.5px;font-weight:900;color:var(--acc)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-family:inherit;font-size:12px;font-weight:800;text-align:left;line-height:1.3}
.opt small{display:block;color:var(--dim);font-weight:700;font-size:10.5px}
.opt.on{border-color:var(--acc);background:#2a1d14}
.seg{display:flex;gap:6px;margin:4px 0 10px;align-items:center}
.seg span{font-size:12px;color:var(--dim);margin-right:auto}
.seg button{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font-weight:800;font-family:inherit;font-size:12.5px}
.seg button.on{background:var(--txt);color:#111;border-color:var(--txt)}
.opt span{font-weight:900}
.fbox{padding:12px;border:1px solid #5a3a20;border-radius:12px;background:linear-gradient(#21160f,#16131c);margin-bottom:8px}
.newtag{font-size:10px;font-weight:900;background:#ff4f6d;color:#fff;border-radius:4px;padding:1px 5px;margin-left:4px}
</style>
</head>
<body>

let BQ=new Int32Array(4096),BP=new Int32Array(4096),BD=new Int32Array(4096);

function bfs(sr,sc,visit,limit){

  BP.fill(-2,0,N);

  while(h<t){
    const i=BQ[h++],r=(i/COLS)|0,c=i-r*COLS,d=BD[i];

    for(let k=0;k<4;k++){const rr=r+DR[k],cc=c+DC[k];if(rr<0||rr>R||cc<0||cc>=COLS)continue;const j=rr*COLS+cc;if(BP[j]!==-2||!isEmpty(rr,cc))continue;BP[j]=i;BD[j]=d+1;BQ[t++]=j}

      const o=S.grid[nr].o[nc];const sc=d-nr*0.35+Math.random()*1.5-(REV[nr][nc]&&o>0?2+o:0);
      if(sc<bs){bs=sc;best={r:nr,c:nc,si:i}}}

  if(!best)return null;best.path=pathTo(best.si);return best;

function offline(){

  const nf=simulate(used*eff);
  if(away<60)return;
  const diff=[];for(const k in S.store){const d=S.store[k]-(before[k]||0);if(d>0)diff.push([+k,d])}
  for(const k in before){if(!(k in S.store)&&before[k]>0)diff.push([+k,-before[k]])}

  h+=`<div class="mrow"><span>최고 깊이</span><b>${r0}층 → ${S.maxRow}층</b></div>`;
  h+=`<div class="mrow"><span>캔 블록</span><b>${fmt(S.blocks-b0)}개</b></div>`;
  diff.filter(d=>d[1]>0).sort((a,b)=>b[0]-a[0]).forEach(([i,d])=>{const o=ORES[i];h+=`<div class="mrow"><span class="l"><span class="sw" style="background:${o.c}"></span>${o.n}${nf.includes(i)?'<span class="newtag">NEW</span>':''}</span><b>+${fmt(d)}</b></div>`});
  if(storeTotal()>=storeCap())h+=`<p style="color:var(--red);margin-top:8px">📦 창고가 가득 찼어요! 팔거나 창고를 넓혀주세요.</p>`;

}

}

let lastT=performance.now(),pd=null;
function frame(now){
  const dt=Math.min(.1,(now-lastT)/1000);lastT=now;
  step(dt);
  if(elev.hold>0){elev.y+=(elev.target-elev.y)*Math.min(1,dt*10);elev.hold-=dt}else elev.y+=(0-elev.y)*Math.min(1,dt*4);
  if(!pd){
    if(camGo!==null){camY+=(camGo-camY)*Math.min(1,dt*7);if(Math.abs(camGo-camY)<1)camGo=null}
    else if(Math.abs(vel)>5){camY+=vel*dt;vel*=Math.pow(.04,dt)}
  }
  camY=Math.max(0,Math.min(maxCam(),camY));
  flash=Math.max(0,flash-dt*1.5);
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=500*dt;if(q.life<=0)parts.splice(i,1)}
  if(parts.length>500)parts.splice(0,parts.length-500);
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.life-=dt;f.y-=30*dt;if(f.life<=0)floats.splice(i,1)}
  if(floats.length>40)floats.splice(0,floats.length-40);
  S.last=Date.now();
  draw(now/1000);requestAnimationFrame(frame);
}

      setH(f1.querySelector('.nm'),`창고 확장<small>Lv ${S.storeLv}</small>`);setH(f1.querySelector('.ds'),`최대 ${fmt(cap)} → ${fmt(Math.floor(60*Math.pow(1.6,S.storeLv+1)))}`);
      const c1=storeCost();setH(f1.querySelector('.buy'),`확장<small>🪙 ${fmt(c1)}</small>`);f1.querySelector('.buy').disabled=S.gold<c1;
      setH(f2.querySelector('.nm'),`엘리베이터<small>Lv ${S.elevLv}</small>`);setH(f2.querySelector('.ds'),`지하 ${elevDepth()}층 → ${elevDepth()+10}층까지 연결<br>맨 왼쪽 칸이 뚫려 있으면 거기서 바로 올려보내요`);
      const c2=elevCost();setH(f2.querySelector('.buy'),`연장<small>🪙 ${fmt(c2)}</small>`);f2.querySelector('.buy').disabled=S.gold<c2;
      let any=false;
      rows.forEach((o,i)=>{const n=S.store[i]||0;if(!n){o.r.style.display='none';return}any=true;o.r.style.display='';
        setH(o.nm,`${ORES[i].n}<small>×${fmt(n)}</small>`);setH(o.ds,`개당 🪙 ${fmt(price(i))} · 전부 🪙 ${fmt(n*price(i))}`)});
      em.style.display=any?'none':'';
    };
  },
  prob(){
    const hd=el('div','hd');panel.appendChild(hd);
    const rows=ORES.map(()=>{const r=el('div','pr',`<div class="sw"></div><div style="flex:1;min-width:0"><div class="t"></div><div class="bar"><i></i></div></div><div class="pct"></div>`);panel.appendChild(r);
      return{sw:r.querySelector('.sw'),t:r.querySelector('.t'),bar:r.querySelector('.bar i'),pct:r.querySelector('.pct')}});
    return()=>{const R=S.maxRow+1,ps=probs(R);
      setH(hd,`지하 <b>${R}층</b> 블록 기준 확률<br>새 광석은 <b>0.1%</b>로 처음 등장해서 깊이 내려갈수록 점점 올라가요. 광석 근처까지 파면 블록에 반짝이가 보여요.`);
      rows.forEach((o,i)=>{const O=ORES[i],f=S.found[O.id]||i===0,p=ps[i];
        o.sw.style.background=f?O.c:'#2a2532';
        setH(o.t,(f?O.n:'???')+(R<O.u?` <span>· ${O.u}층부터 등장</span>`:` <span>· 개당 ${fmt(price(i))}</span>`));
        o.bar.style.width=(p>0?Math.max(2,Math.log10(p*1e4)/4*100):0)+'%';o.bar.style.background=f?O.c:'#666';
        setH(o.pct,pf(p));o.pct.style.color=p>0?'var(--txt)':'#5a5262'})};
  },
  dex(){
    const hd=el('div','hd');panel.appendChild(hd);const g=el('div','grid');panel.appendChild(g);
    const cards=ORES.map(()=>{const c=el('div','card','<div class="gem"></div><div class="nm"></div><div class="ds"></div>');g.appendChild(c);return{gem:c.querySelector('.gem'),nm:c.querySelector('.nm'),ds:c.querySelector('.ds')}});
    return()=>{const n=ORES.filter(o=>S.found[o.id]).length;
      setH(hd,`발견 <b>${n} / ${ORES.length}</b> · 캔 블록 <b>${fmt(S.blocks)}</b> · 역대 최고 <b>${S.best}층</b> · 환생 <b>${S.prestiges}회</b>`);
      cards.forEach((c,i)=>{const O=ORES[i],f=S.found[O.id];c.gem.style.background=f?O.c:'#2a2532';setH(c.nm,f?O.n:'???');setH(c.ds,f?`🪙 ${fmt(O.v)} · ${fmt(f)}개`:`지하 ${O.u}층~`)})};
  },
  reb(){
    const hd=el('div','hd');panel.appendChild(hd);
    const big=el('button','big');big.onclick=()=>{const g=fossilGain();if(g<=0)return;
      modal(`<h2>🌋 지각 붕괴</h2><p>골드·광부·기계·장비·창고·광산이 전부 초기화돼요.<br>도감과 화석 업그레이드는 유지돼요.</p><div class="mrow"><span>얻는 화석</span><b style="color:var(--fos)">🦴 +${g}</b></div>`,[['취소',null,1],['붕괴시키기!',prestige]])};
    panel.appendChild(big);
    panel.appendChild(el('div','sect f','🦴 화석 상점 — 영구 업그레이드'));
    const rows=FU.map(q=>{const r=el('div','row',`<div class="ic">${q.e}</div><div class="info"><div class="nm"></div><div class="ds"></div></div><button class="buy fos"></button>`);
      const b=r.querySelector('.buy');b.onclick=()=>{const c=Math.ceil(q.c*Math.pow(q.g,S.fu[q.k]));if(S.fossils>=c&&!(q.max&&S.fu[q.k]>=q.max)){S.fossils-=c;S.fu[q.k]++;upd()}};panel.appendChild(r);return{q,nm:r.querySelector('.nm'),ds:r.querySelector('.ds'),b}});
    const rs=el('button','reset','데이터 초기화');rs.onclick=()=>modal('<h2>정말 초기화?</h2><p>모든 진행 상황(화석·도감 포함)이 사라져요.</p>',[['취소',null,1],['초기화',()=>{newGame();save();closeSheet()}]]);panel.appendChild(rs);
    return()=>{const g=fossilGain(),next=Math.ceil(20*Math.pow(g+1,1/1.8));
      setH(hd,`<b>지각 붕괴</b>로 처음부터 다시 시작하는 대신 <b style="color:var(--fos)">고대 화석</b>을 얻어요. 깊이 팔수록 더 많이 받아요.<br>이번 판 최고 깊이 <b>${S.maxRow}층</b>`+(g>0?` · 다음 화석까지 <b>${Math.max(0,next-S.maxRow)}층</b>`:''));
      big.disabled=g<=0;setH(big,g>0?`🌋 지각 붕괴! 🦴 +${g}`:`지하 60층부터 가능 (지금 ${S.maxRow}층)`);
      rows.forEach(o=>{const q=o.q,lv=S.fu[q.k];setH(o.nm,`${q.n}<small>Lv ${lv}${q.max?' / '+q.max:''}</small>`);setH(o.ds,q.d);
        if(q.max&&lv>=q.max){o.b.disabled=true;setH(o.b,'MAX');return}
        const c=Math.ceil(q.c*Math.pow(q.g,lv));setH(o.b,`구매<small>🦴 ${c}</small>`);o.b.disabled=S.fossils<c})};
  },
};
function hud(){
  setH($('#gold'),'🪙 '+fmt(S.gold));setH($('#fos'),'🦴 '+S.fossils);
  const tot=storeTotal(),cap=storeCap(),ps=people().length,mc=S.agents.length-ps;
  setH($('#dline'),`최고 지하 <b>${S.maxRow}층</b> · 👷 <b>${ps}</b>${mc?' · ⚙️ <b>'+mc+'</b>':''}`);
  setH($('#sline'),`<span class="${tot>=cap?'warn':''}">📦 ${fmt(tot)}/${fmt(cap)}</span>${mc?' · ⛽ <b>'+fmt(S.store[1]||0)+'</b>':''}`);
}

/* ================= 시작 ================= */
S=load();
if(S)initRuntime();else newGame();
resize();
window.addEventListener('resize',()=>{resize()});
setInterval(()=>{hud();upd()},250);
setInterval(save,5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{lastT=performance.now();offline()}});
window.addEventListener('pagehide',save);
hud();offline();
requestAnimationFrame(frame);
</script>
</body>
</html>
