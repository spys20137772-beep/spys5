<!DOCTYPE html>
<html lang="ko">
<head>
<script src="/-/cloud-sync.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1230">
<title>말랑 상자</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#1a1230;color:#fff4fb;font-family:'Jua',system-ui,sans-serif;overscroll-behavior:none;touch-action:manipulation}
body{background:radial-gradient(circle at 50% 0%,#5a2d7a 0%,#1a1230 65%) fixed;overflow:hidden}
#app{max-width:520px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex;animation:fade .18s}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:16px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.bar{display:flex;align-items:center;gap:8px;padding:8px 0 6px;flex:none}
.bar h2{flex:1;margin:0;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coin{display:flex;align-items:center;gap:6px;background:#2d1f4d;border-radius:20px;padding:5px 11px;font-size:17px;color:#ffd84d;flex:none}
.coin i{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#ffc21f 60%,#c98a00);display:inline-block}
.back{flex:none;background:#3a2a62;border:none;color:#fff;font-family:inherit;font-size:15px;border-radius:12px;padding:8px 12px}
h1{font-size:44px;margin:4px 0 0;text-align:center;background:linear-gradient(90deg,#ffb3d9,#ffd84d,#8ae6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:#c7a9e6;margin:0 0 4px}
#homeCv{display:block;margin:0 auto;width:250px;height:165px}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:14px;margin:8px 0;font-family:inherit;font-size:19px;color:#fff;background:linear-gradient(135deg,#ff6bb5,#ff8ad8);box-shadow:0 5px 0 #a8326f;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a8326f}
.btn.b{background:linear-gradient(135deg,#5b7cff,#7d9aff);box-shadow:0 5px 0 #2c3fa0}
.btn.g{background:linear-gradient(135deg,#2bc97e,#57e3a0);box-shadow:0 5px 0 #157a4a}
.btn.y{background:linear-gradient(135deg,#ffb020,#ffd04d);box-shadow:0 5px 0 #a86a00;color:#3a2600}
.btn.p{background:linear-gradient(135deg,#9a5cff,#c07dff);box-shadow:0 5px 0 #5a2aa8}
.btn.d{background:#3a2a62;box-shadow:0 4px 0 #22163d}
.btn.s{font-size:15px;padding:10px 6px;border-radius:13px;margin:5px 0}
.row{display:flex;gap:7px}.row .btn{margin:5px 0}
.card{background:#2a1d48cc;border:1px solid #4a3578;border-radius:16px;padding:11px;margin:8px 0}
.boxrow{display:flex;gap:10px;align-items:center}
.boxrow canvas{width:84px;height:84px;flex:none}
.boxrow .t{font-size:19px}.boxrow .d{font-size:13px;color:#c7a9e6;line-height:1.35}
.tabs{display:flex;gap:6px;margin:4px 0;flex:none}.tabs .btn{margin:0}
.tabs .btn.on{outline:2px solid #ffd84d}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tc{background:#2a1d48;border:2px solid #4a3578;border-radius:13px;padding:3px 3px 5px;text-align:center;font-size:12.5px;cursor:pointer;position:relative;line-height:1.25}
.tc img{width:100%;display:block;aspect-ratio:9/10;object-fit:contain}
.tc .g1{position:absolute;left:4px;top:3px;font-size:13px;padding:0 6px;border-radius:7px;color:#fff;text-shadow:0 1px 2px #0008}
.tc.unseen img{filter:brightness(0) opacity(.35)}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.cslot{position:relative;border-radius:10px;overflow:hidden;background:#24183f;aspect-ratio:63/88;cursor:pointer}
.cslot img{width:100%;height:100%;display:block}
.cslot .no{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#5a4a80;font-size:18px}
.cslot .cnt{position:absolute;right:4px;bottom:4px;background:#000a;border-radius:8px;padding:0 6px;font-size:12px}
.g2t{font-size:12px}
.stars{display:inline-flex;gap:1px;vertical-align:middle}.stars svg{width:10px;height:10px}
.big .stars svg{width:16px;height:16px}
.rb{background:linear-gradient(90deg,#ff5b5b,#ffb03b,#ffe14d,#5bff8a,#4dc3ff,#b04dff);-webkit-background-clip:text;background-clip:text;color:transparent}
.rbb{background:linear-gradient(90deg,#ff5b5b,#ffb03b,#5bff8a,#4dc3ff,#b04dff)!important}
canvas{touch-action:none}
#playWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#playCv,#cleanCv{display:block;border-radius:18px;background:radial-gradient(circle at 50% 40%,#3a2a62,#221640);border:2px solid #4a3578}
.info{display:flex;justify-content:space-between;align-items:center;margin:0 2px 2px;font-size:15px;gap:6px;flex:none}
.wear{height:5px;background:#3a2a62;border-radius:4px;overflow:hidden;margin:2px 2px 6px;flex:none}
.wear div{height:100%;background:linear-gradient(90deg,#ffd84d,#ff6b8a)}
.foot{flex:none;padding-top:6px}
.hint{text-align:center;font-size:12.5px;color:#c7a9e6;min-height:16px}
.tools{display:flex;gap:6px;overflow-x:auto;padding:4px 0 6px;flex:none}
.tool{flex:none;background:#2a1d48;border:2px solid #4a3578;border-radius:12px;padding:5px 7px;font-family:inherit;color:#fff;font-size:12.5px;text-align:center;min-width:72px}
.tool.sel{border-color:#ffd84d;box-shadow:0 0 10px #ffd84d66}
.tool .dur{height:4px;background:#3a2a62;border-radius:3px;margin-top:3px;overflow:hidden}.tool .dur div{height:100%;background:#57e3a0}
.ov{position:fixed;inset:0;z-index:40;background:#0b0614f4;display:none;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
.ov.on{display:flex}
.ov canvas{display:block}
.ovBtns{width:100%;max-width:440px;min-height:54px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#ffd84d;color:#3a2600;padding:10px 16px;border-radius:14px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90%;text-align:center}
#toast.on{opacity:1}
.small{font-size:12.5px;color:#c7a9e6;line-height:1.5}
.empty{color:#9a83c2;text-align:center;padding:20px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11.5px;text-align:center;margin-top:5px}
.rate div{background:#1d1335;border-radius:7px;padding:3px}
</style>
</head>
<body>
<div id="app">

<div class="screen on" id="home"><div class="scroll">
  <div class="bar"><h2></h2><div class="coin"><i></i><span class="cv">0</span></div></div>
  <h1>말랑 상자</h1>
  <div class="sub">까고 · 만지고 · 모으고</div>
  <canvas id="homeCv" width="500" height="330"></canvas>
  <button class="btn" onclick="go('shop')">상점</button>
  <div class="row"><button class="btn b" onclick="go('coll')">내 장난감</button><button class="btn p" onclick="go('binder')">말랑몬 바인더</button></div>
  <div class="row"><button class="btn s g" onclick="go('toolInv')">청소 도구함</button><button class="btn s d" onclick="go('dex')">장난감 도감</button></div>
  <div class="small" style="text-align:center;margin-top:8px" id="homeStat"></div>
</div></div>

<div class="screen" id="shop">
  <div class="bar"><button class="back" onclick="go('home')">뒤로</button><h2>상점</h2><div class="coin"><i></i><span class="cv">0</span></div></div>
  <div class="tabs"><button class="btn s d" id="stab0" onclick="shopTab=0;renderShop()">장난감 상자</button><button class="btn s d" id="stab1" onclick="shopTab=1;renderShop()">카드팩</button><button class="btn s d" id="stab2" onclick="shopTab=2;renderShop()">청소 도구</button></div>
  <div class="scroll" id="shopBody"></div>
</div>

<div class="screen" id="coll">
  <div class="bar"><button class="back" onclick="go('home')">뒤로</button><h2>내 장난감</h2><div class="coin"><i></i><span class="cv">0</span></div></div>
  <div class="tabs"><button class="btn s d" id="sortG" onclick="sortMode='grade';renderColl()">등급순</button><button class="btn s d" id="sortN" onclick="sortMode='new';renderColl()">최근순</button><button class="btn s d" id="sortS" onclick="sortMode='star';renderColl()">별순</button></div>
  <div class="scroll"><div class="grid" id="collGrid"></div></div>
</div>

<div class="screen" id="play">
  <div class="bar"><button class="back" onclick="leavePlay()">뒤로</button><h2 id="pName"></h2><div class="coin"><i></i><span class="cv">0</span></div></div>
  <div class="info big"><span id="pGrade"></span><span id="pStars"></span></div>
  <div class="wear"><div id="pWear"></div></div>
  <div id="playWrap"><canvas id="playCv"></canvas></div>
  <div class="foot">
    <div class="hint" id="pHint"></div>
    <div class="row" id="pBtns"></div>
  </div>
</div>

<div class="screen" id="clean">
  <div class="bar"><button class="back" onclick="endClean()">뒤로</button><h2>청소</h2><div class="coin"><i></i><span class="cv">0</span></div></div>
  <div class="info big"><span id="cName"></span><span id="cStars"></span></div>
  <div class="small" id="cCap" style="flex:none"></div>
  <div id="cleanWrap" style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center"><canvas id="cleanCv"></canvas></div>
  <div class="small" style="flex:none">도구 고르고 얼룩을 문질러요</div>
  <div class="tools" id="cTools"></div>
</div>

<div class="screen" id="toolInv">
  <div class="bar"><button class="back" onclick="go('home')">뒤로</button><h2>청소 도구함</h2><div class="coin"><i></i><span class="cv">0</span></div></div>
  <div class="scroll"><div class="grid" id="toolGrid"></div><button class="btn g" onclick="shopTab=2;go('shop')">도구 사러 가기</button></div>
</div>

<div class="screen" id="dex">
  <div class="bar"><button class="back" onclick="go('home')">뒤로</button><h2>장난감 도감</h2><div class="coin"><i></i><span class="cv">0</span></div></div>
  <div class="small" id="dexStat" style="flex:none"></div>
  <div class="scroll"><div class="grid" id="dexGrid"></div></div>
</div>

<div class="screen" id="binder">
  <div class="bar"><button class="back" onclick="go('home')">뒤로</button><h2>말랑몬 바인더</h2><div class="coin"><i></i><span class="cv">0</span></div></div>
  <div class="row" style="flex:none;align-items:center"><div class="small" id="binStat" style="flex:1"></div><button class="btn s d" style="width:auto;padding:8px 12px" onclick="sellDupes()">중복 카드 팔기</button></div>
  <div class="scroll"><div class="cgrid" id="binGrid"></div><button class="btn p" onclick="shopTab=1;go('shop')">카드팩 사러 가기</button></div>
</div>

</div>
<div class="ov" id="openScr"><canvas id="openCv"></canvas><div class="ovBtns" id="openBtns"></div></div>
<div class="ov" id="packScr"><canvas id="packCv"></canvas><div class="ovBtns" id="packBtns"></div></div>
<div class="ov" id="cardScr"><canvas id="cardCv"></canvas><div class="ovBtns" id="cardBtns"></div></div>
<div id="toast"></div>

  case 'mochi': c.ellipse(0,R*.15,R*1.15,R*.75,0,0,7); break;
  case 'long': c.ellipse(0,0,R*1.25,R*.7,0,0,7); break;

ccv.addEventListener('pointermove',e=>{ if(!CL||!CL.down||CL.done||!CL.tool) return; const [x,y]=cleanPtr(e); const dd=Math.hypot(x-CL.px,y-CL.py); CL.px=x; CL.py=y; if(dd<.5) return;
 const d=TLD[CL.tool.k]; let any=false;
 for(const q of CL.spots){ if(q.hp<=0) continue; if(Math.hypot(q.x-x,q.y-y)<q.r+14){ const rem=Math.min(q.hp,dd*d.pw*.9); q.hp-=rem; CL.tool.dur-=rem; any=true; if(R_()<.5&&CL.foam.length<120) CL.foam.push({x:x+(R_()-.5)*20,y:y+(R_()-.5)*20,vx:(R_()-.5)*30,vy:-R_()*30,life:1,r:3+R_()*7}); if(q.hp<=0){ SFX.sparkle(); vib(25); for(let i=0;i<10;i++) CL.foam.push({x:q.x,y:q.y,vx:(R_()-.5)*160,vy:(R_()-.5)*160,life:.8,r:2+R_()*3,sp:1}); } } }
 if(any){ CL.acc+=dd; if(CL.acc>22){ CL.acc=0; SFX.squeak(); vib(5); } if(CL.tool.dur<=0){ useUpTool(); CL.down=false; } checkCleanDone(); } });
ccv.addEventListener('pointerup',()=>{ if(CL){ CL.down=false; renderCleanTools(); save(); } });
function checkCleanDone(){ if(CL.done||CL.spots.some(q=>q.hp>0)) return; CL.done=true; const t=CL.toy; let msg='';
 if(t.st<t.cap){ t.st++; t.wear=0; msg=`반짝반짝! 별 ${t.st}개가 됐어요`; if(t.st>=t.cap){ t.capKnown=true; msg+=' (이게 한도예요)'; } }
 else { if(R_()<(CL.usedBonus||0) && t.cap<10){ t.cap++; t.st++; t.wear=0; msg=`대박! 숨겨진 한도가 올라갔어요! 별 ${t.st}개`; SFX.fanfare(3); } else { msg='깨끗해졌지만 한도는 그대로예요'; t.capKnown=true; } }
 thumbCache.clear(); save(1); updCleanInfo(); SFX.sparkle(); setTimeout(()=>SFX.star(8,true),200); vib([30,40,60]); toast(msg);
 setTimeout(()=>{ if(cur==='clean') endClean(); },1600); }
function endClean(){ const u=CL&&CL.toy.u; CL=null; if(u) openPlay(u); else go('coll'); }
function drawClean(t,dt){ const c=CL.lx, sc=CL.sc; c.setTransform(sc,0,0,sc,0,0); c.clearRect(0,0,CW,CH); E[CL.d.e].draw(c,CL.s,CL.d,t); g2Overlay(c,CL.toy,t); dirtOverlay(c,CL.toy);
 c.save(); c.globalCompositeOperation='source-atop';
 for(const q of CL.spots){ if(q.hp<=0) continue; const a=q.hp/100; const r=srand(q.seed*1e6); c.fillStyle=`rgba(80,60,40,${.75*a})`; c.beginPath(); for(let k=0;k<9;k++){ const an=k/9*7, q2=q.r*(.65+r()*.5); c.lineTo(q.x+Math.cos(an)*q2,q.y+Math.sin(an)*q2); } c.closePath(); c.fill(); }
 c.restore();
 for(const q of CL.spots){ if(q.hp<=0) continue; c.strokeStyle=`rgba(255,216,77,${.25+.25*Math.sin(t*5)})`; c.setLineDash([4,5]); c.lineWidth=2; c.beginPath(); c.arc(q.x,q.y,q.r+6,0,7); c.stroke(); c.setLineDash([]); }
 for(const f of CL.foam){ f.life-=dt; f.x+=f.vx*dt; f.y+=f.vy*dt; c.globalAlpha=Math.max(0,f.life); if(f.sp) sparkleShape(c,f.x,f.y,f.r*2,'#fff'); else { c.beginPath(); c.arc(f.x,f.y,f.r,0,7); c.fillStyle=f.rb?`hsla(${f.x*3},100%,80%,.7)`:'rgba(255,255,255,.75)'; c.fill(); c.strokeStyle='rgba(180,220,255,.8)'; c.lineWidth=1; c.stroke(); } } c.globalAlpha=1; if(CL.foam.length) CL.foam=CL.foam.filter(f=>f.life>0);
 if(CL.down&&CL.tool){ c.globalAlpha=.9; drawTool(c,CL.tool.k,CL.px+20,CL.py-20,.55); c.globalAlpha=1; }
 cctx.setTransform(1,0,0,1,0,0); cctx.clearRect(0,0,ccv.width,ccv.height); cctx.drawImage(CL.L,0,0); }

// 홈 장식

const hcv=$('#homeCv'), hctx=hcv.getContext('2d');
const homeToy={k:'wax',g2:4,st:10,u:6};
const homeWax=E.wax.init(TD.wax);
function drawHome(t){ hctx.clearRect(0,0,500,330);
 drawMon(hctx,MONS[0],95,200,52,t); drawMon(hctx,MONS[18],405,200,50,t+1);
 homeWax.press=Math.sin(t*2)>.7; homeWax.fx=CX; homeWax.fy=CY; E.wax.step(homeWax,1/60,TD.wax); if(homeWax.press&&!homeWax._p&&homeWax.shards.length){ } homeWax._p=homeWax.press;
 tctx.setTransform(1,0,0,1,0,0); tctx.clearRect(0,0,CW,CH); E.wax.draw(tctx,homeWax,TD.wax,t); g2Overlay(tctx,homeToy,t); hctx.drawImage(tcv,150,10,200,222); }

// =====================================================================
// 메인 루프
// =====================================================================
let last=0;
function loop(ts){ requestAnimationFrame(loop); const dt=Math.min(.05,(ts-last)/1000||0); last=ts; const t=ts/1000; perfTick(dt);
 if(OP) stepOpen(dt);
 else if(PK) stepPack(dt);
 else if(CV) stepCard(dt);
 else if(cur==='play'&&PL) drawPlay(t,dt);
 else if(cur==='clean'&&CL) drawClean(t,dt);
 else if(cur==='home') drawHome(t);
 else if(cur==='shop') drawShop(t); }
requestAnimationFrame(loop);
let rzT=0; window.addEventListener('resize',()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ refit(); if(OP) OP.sc=fitOv(ocv,OW,OH); if(PK) PK.sc=fitOv(pcv2,PW,PH); if(CV) CV.sc=fitOv(ccv3,300,420); },120); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ save(1); whirOff(); } });
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
refreshCoins(); renderHome();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ cardImgCache.clear(); thumbCache.clear(); if(cur==='coll') renderColl(); if(cur==='binder') renderBinder(); });
</script>
