<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>피하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: 짧고 굵은 아케이드
   IDEA: 경고 테이프 붙은 위험 구역, 스테이지마다 다른 세계
   PICTURE: 전체 화면 경기장 + 스테이지 카드 목록
   COLOUR and TYPE: 경고 노랑, 잉크 검정, 빨강, 지옥은 진홍 / Black Han Sans + Gothic A1
   LAYOUT: 전체 화면, 화면 전환은 오버레이 */
:root{--y:#ffd23f;--ink:#16130e;--red:#e8322b;--hell:#b3121b;--pan:rgba(22,19,14,.92)}
*{box-sizing:border-box;margin:0;min-width:0}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--ink);font-family:'Gothic A1',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;cursor:pointer;border:0;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.hide{display:none!important}
.tape{height:16px;flex:none;background:repeating-linear-gradient(-45deg,var(--ink) 0 14px,var(--y) 14px 28px)}
.bigbtn{font:22px 'Black Han Sans',sans-serif;background:var(--ink);color:var(--y);border-radius:14px;padding:14px 26px;min-height:56px;box-shadow:0 6px 0 #000;width:100%}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #000}
.coin{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.coin i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#f5b301 60%,#a86f00);box-shadow:0 0 0 2px var(--ink);display:inline-block}
/* 타이틀 */
#title{background:var(--y);align-items:stretch}
#title .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#title h1{font:clamp(64px,20vw,110px)/1 'Black Han Sans',sans-serif;letter-spacing:-2px}
#title .sub{font-weight:700;font-size:15px;max-width:28ch}
#title .btns{display:grid;gap:14px;width:min(320px,100%);margin-top:10px}
#title .btns .alt{background:#fff;color:var(--ink)}
/* 공통 상단바 */
.top{display:flex;align-items:center;gap:12px;padding:max(12px,env(safe-area-inset-top)) 16px 12px;background:var(--y);flex:none}
.top h2{font:26px 'Black Han Sans',sans-serif;flex:1}
.back{width:44px;height:44px;border-radius:12px;background:var(--ink);color:var(--y);font:22px 'Black Han Sans',sans-serif}
.list{flex:1;overflow-y:auto;padding:14px 14px 30px;background:#24201a;touch-action:pan-y;-webkit-overflow-scrolling:touch}
/* 스테이지 카드 */
.st{position:relative;display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:center;background:#fffdf5;border-radius:16px;padding:10px;margin-bottom:12px;box-shadow:0 4px 0 #000}
.st .th{width:86px;height:104px;border-radius:10px;background:#888 center/cover;position:relative;overflow:hidden}
.st .th b{position:absolute;left:6px;top:4px;font:22px 'Black Han Sans',sans-serif;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000}
.st h3{font:21px 'Black Han Sans',sans-serif}
.st .rec{font-size:13px;font-weight:700;color:#5b5446;margin:2px 0 8px}
.st .row{display:flex;gap:8px;flex-wrap:wrap}
.st .row button{flex:1;min-height:44px;border-radius:10px;font:17px 'Black Han Sans',sans-serif;background:var(--ink);color:var(--y);padding:0 10px;white-space:nowrap}
.st .row .h{background:var(--hell);color:#fff}
.st .row button:disabled{background:#cfc8b8;color:#8a8273}
.st.lock{filter:grayscale(1);opacity:.6}
.st.lock .th::after{content:'잠김';font:800 14px 'Gothic A1',sans-serif;color:#fff;position:absolute;inset:0;display:grid;place-items:center;font-size:30px;background:rgba(0,0,0,.45)}
.st .fl{position:absolute;right:10px;top:8px;font-size:12px;font-weight:800;color:#fff;background:var(--hell);border-radius:8px;padding:3px 7px}
.st .ok{position:absolute;right:10px;top:8px;font-size:12px;font-weight:800;color:var(--ink);background:var(--y);border-radius:8px;padding:3px 7px}
.st .fl+.ok,.st .ok+.fl{right:auto;left:auto}
.badges{position:absolute;right:10px;top:8px;display:flex;gap:4px}
.badges span{font-size:12px;font-weight:800;border-radius:8px;padding:3px 7px}
.badges .c{background:var(--y)}.badges .f{background:var(--hell);color:#fff}
.more{color:#d8cfbd;text-align:center;font-size:13px;font-weight:700;padding:10px}
/* 상점 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.sk{background:#fffdf5;border-radius:16px;padding:12px;text-align:center;box-shadow:0 4px 0 #000;display:flex;flex-direction:column;align-items:center;gap:6px}
.sk img{width:84px;height:84px;object-fit:contain}
.sk h4{font:18px 'Black Han Sans',sans-serif}
.sk .ds{font-size:12px;color:#5b5446;font-weight:700;min-height:16px}
.sk button{width:100%;min-height:44px;border-radius:10px;font:16px 'Black Han Sans',sans-serif;background:var(--ink);color:var(--y)}
.sk button.on{background:var(--y);color:var(--ink);box-shadow:inset 0 0 0 3px var(--ink)}
.sk button:disabled{background:#cfc8b8;color:#8a8273}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 12px 0;pointer-events:none;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6)}
#hud .l1{display:flex;align-items:center;gap:10px}
#hud .nm{font:16px 'Black Han Sans',sans-serif;flex:1}
#hud .nm em{font-style:normal;background:var(--hell);padding:1px 7px;border-radius:6px;margin-left:6px;text-shadow:none}
#hud .tm{font:44px/1 'Black Han Sans',sans-serif;font-variant-numeric:tabular-nums;margin-top:4px}
#hud .bar{height:8px;border-radius:4px;background:rgba(0,0,0,.4);margin-top:6px;overflow:hidden}
#hud .bar i{display:block;height:100%;width:0;background:var(--y)}
#pause,#bSkip{pointer-events:auto;width:44px;height:44px;border-radius:12px;background:rgba(22,19,14,.75);color:#fff;font:18px 'Black Han Sans',sans-serif}
#hud .hp{font-size:22px;letter-spacing:1px;margin-right:4px}#hud .hp b{color:#ff3b4a}#hud .hp s{text-decoration:none;color:rgba(255,255,255,.3)}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;font:28px/1.1 'Black Han Sans',sans-serif;color:#fff;text-shadow:0 3px 0 #000;opacity:0;transition:opacity .3s;pointer-events:none}
#banner small{display:block;font:800 14px 'Gothic A1',sans-serif;margin-top:6px}
/* 결과·일시정지 */
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.55)}
.card{background:var(--y);border-radius:20px;padding:24px 20px;width:min(360px,100%);text-align:center;box-shadow:0 8px 0 #000;display:grid;gap:12px}
.card.hellc{background:#ffd9d4}
.card h2{font:44px/1 'Black Han Sans',sans-serif}
.card .t{font:34px 'Black Han Sans',sans-serif}
.card p{font-weight:700;font-size:15px}
.card .sm{background:#fff;color:var(--ink)}
.setbtn{position:absolute;top:28px;right:14px;width:48px;height:48px;border-radius:12px;background:var(--ink);color:var(--y);font-size:24px;line-height:48px;z-index:2}
.card input{font:700 18px 'Gothic A1',sans-serif;padding:12px 14px;border-radius:12px;border:3px solid var(--ink);width:100%;user-select:text;-webkit-user-select:text;touch-action:manipulation}
.card .err{color:var(--red);min-height:18px}
.admgrid{display:grid;gap:8px}
.adm{font:17px 'Black Han Sans',sans-serif;min-height:48px;border-radius:12px;background:#fff;color:var(--ink);box-shadow:0 4px 0 #000;display:flex;justify-content:space-between;align-items:center;padding:0 14px}
.adm b{font-family:'Gothic A1',sans-serif;font-weight:800;font-size:13px;padding:3px 8px;border-radius:8px;background:#cfc8b8}
.adm.on b{background:var(--red);color:#fff}
.admtag{position:absolute;top:30px;left:14px;font-weight:800;font-size:12px;background:var(--red);color:#fff;border-radius:8px;padding:4px 8px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title" class="scr">
  <div class="tape"></div>
  <button class="setbtn" id="bSet" aria-label="설정">⚙</button>
  <span class="admtag hide" id="admTag">관리자</span>
  <div class="mid">
    <h1>피하기</h1>
    <p class="sub">보스의 손짓 공격을 손가락으로 끌어서 피하세요. 1분 버티면 다음 스테이지가 열려요.</p>
    <span class="coin" id="tCoin"><i></i>0</span>
    <div class="btns">
      <button class="bigbtn" id="bPlay">스테이지</button>
      <button class="bigbtn alt" id="bShop">스킨</button>
    </div>
  </div>
  <div class="tape"></div>
</div>

<div id="stages" class="scr hide">
  <div class="top"><button class="back" data-go="title" aria-label="뒤로">‹</button><h2>스테이지</h2><span class="coin cc"><i></i>0</span></div>
  <div class="list" id="stList"></div>
</div>

<div id="shop" class="scr hide">
  <div class="top"><button class="back" data-go="title" aria-label="뒤로">‹</button><h2>스킨</h2><span class="coin cc"><i></i>0</span></div>
  <div class="list"><div class="grid" id="skList"></div></div>
</div>

<div id="hud" class="hide">
  <div class="l1"><div class="nm" id="hName"></div><span class="hp" id="hHp"></span><span class="coin" id="hCoin"><i></i>0</span><button id="bSkip" class="hide" aria-label="바로 클리어">⏭</button><button id="pause" aria-label="일시정지">II</button></div>
  <div class="tm" id="hTime">1:00</div>
  <div class="bar"><i id="hBar"></i></div>
</div>
<div id="banner"></div>

<div id="mPause" class="modal hide"><div class="card">
  <h2>일시정지</h2>
  <button class="bigbtn" id="bResume">계속</button>
  <button class="bigbtn sm" id="bQuit">그만하기</button>
</div></div>

<div id="mSet" class="modal hide"><div class="card">
  <h2 id="setH">설정</h2>
  <div id="setMain" class="admgrid">
    <button class="adm" data-o="sens">조작 감도<b>보통</b></button>
    <button class="adm" data-o="shake">화면 흔들림<b>ON</b></button>
    <button class="adm" data-o="vib">맞으면 진동<b>ON</b></button>
    <button class="adm" data-o="trail">스킨 꼬리 효과<b>ON</b></button>
    <button class="adm" data-o="hq">고화질<b>ON</b></button>
    <button class="adm" id="bReset">기록 초기화<b>›</b></button>
    <button class="adm" id="bAdmGo">관리자 모드<b id="admState">잠김</b></button>
  </div>
  <div id="admLogin" class="hide" style="display:grid;gap:10px">
    <input id="admPw" type="password" placeholder="비밀번호" autocomplete="off">
    <p class="err" id="admErr"></p>
    <button class="bigbtn" id="bAdmIn">들어가기</button>
  </div>
  <div id="admPanel" class="admgrid hide">
    <button class="adm" data-a="god">무적<b>OFF</b></button>
    <button class="adm" data-a="coin">코인 무제한<b>OFF</b></button>
    <button class="adm" data-a="all">모든 스테이지·지옥 열기<b>OFF</b></button>
    <button class="adm" data-a="skins">모든 스킨 해금<b>OFF</b></button>
    <button class="adm" data-a="fast">2배속<b>OFF</b></button>
    <button class="adm" data-a="skip">판 중 바로 클리어 버튼<b>OFF</b></button>
    <button class="bigbtn sm" id="bAdmOut">관리자 모드 끄기</button>
  </div>
  <button class="bigbtn sm" id="bSetClose">닫기</button>
</div></div>

<div id="mRes" class="modal hide"><div class="card" id="resCard">
  <h2 id="rT">맞았다!</h2>
  <div class="t" id="rTime"></div>
  <p id="rMsg"></p>
  <img id="rSkin" class="hide" alt="" style="width:96px;height:96px;margin:0 auto;object-fit:contain">
  <span class="coin" style="justify-content:center" id="rCoin"><i></i>+0</span>
  <button class="bigbtn" id="bNext">다음 스테이지</button>
  <button class="bigbtn" id="bRetry">다시</button>
  <button class="bigbtn sm" id="bMenu">스테이지 목록</button>
</div></div>

<script>
{
/* ───────── 데이터: 스테이지 추가는 STAGES에 한 줄 + ATK에 공격 3개 ───────── */
const STAGES=[
  {id:'s01',name:'기본',bg:'bg_01_basic',boss:{n:'먹구슬',c1:'#3a3a48',c2:'#000',lc:'#ff3b30'},atks:['b1a','g1a','b1b','g1b','b1c','g1c']},
  {id:'s02',name:'모눈종이',bg:'bg_02_graph',boss:{n:'폭탄 대장',c1:'#3a4a6e',c2:'#0c1020',lc:'#ff8a1f'},atks:['b2a','g2a','b2b','g2b','b2c','g2c']},
  {id:'s03',name:'칠판',bg:'bg_03_chalkboard',boss:{n:'분필 선생',c1:'#f4f1e6',c2:'#3a3a33',lc:'#ffffff'},atks:['b3a','g3a','b3b','g3b','b3c','g3c']},
  {id:'s04',name:'노을',bg:'bg_04_sunset',boss:{n:'노을 태양',c1:'#ffb347',c2:'#8a3a00',lc:'#ff9a1f'},atks:['b4a','g4a','b4b','g4b','b4c','g4c']},
  {id:'s05',name:'밤',bg:'bg_05_night',boss:{n:'깨진 모니터',c1:'#2a2d3a',c2:'#ff4fd8',lc:'#ff4fd8'},atks:['b5a','g5a','b5b','g5b','b5c','g5c']},
  {id:'s06',name:'숲',bg:'bg_06_forest',boss:{n:'고목나무',c1:'#8a5a32',c2:'#3a2210',lc:'#ffe14d'},atks:['b6a','g6a','b6b','g6b','b6c','g6c']},
  {id:'s07',name:'비 오는 도시',bg:'bg_07_rainy_city',boss:{n:'먹구름',c1:'#5a6070',c2:'#1c1f28',lc:'#9fe0ff'},atks:['b7a','g7a','b7b','g7b','b7c','g7c']},
  {id:'s08',name:'사막',bg:'bg_08_desert',boss:{n:'바위 골렘',c1:'#a88a62',c2:'#3a2a14',lc:'#ffb347'},atks:['b8a','g8a','b8b','g8b','b8c','g8c']},
  {id:'s09',name:'설산',bg:'bg_09_snow_mountain',boss:{n:'눈 거인',c1:'#f2f7ff',c2:'#4a6a98',lc:'#9fdcff'},atks:['b9a','g9a','b9b','g9b','b9c','g9c']},
  {id:'s10',name:'해 질 녘 바다',bg:'bg_10_sunset_sea',boss:{n:'대왕 고래',c1:'#3a7ad6',c2:'#0a2a5a',lc:'#4fe0d0'},atks:['b10a','g10a','b10b','g10b','b10c','g10c']}
];
const NORMAL_T=60,HELL_T=180;
const SKINS=[
  {id:'basic',name:'동그라미',price:0},
  {id:'cat',name:'고양이',price:150},
  {id:'slime',name:'슬라임',price:300},
  {id:'ghost',name:'유령',price:500},
  {id:'star',name:'별',price:800,trail:'#ffe14d'},
  {id:'robot',name:'로봇',price:1200,trail:'#5cd6ff'},
  {id:'flame',name:'불꽃',price:2000,trail:'#ff7a1a'},
  /* 지옥 클리어 전용 스킨: hell = 깨야 하는 스테이지 id */
  {id:'h_ink',name:'먹물이',hell:'s01',trail:'#8a8aa0'},
  {id:'h_bomb',name:'폭탄이',hell:'s02',trail:'#ff8a00'},
  {id:'h_eraser',name:'칠판지우개',hell:'s03',trail:'#ffffff'},
  {id:'h_sun',name:'해님',hell:'s04',trail:'#ffb000'},
  {id:'h_moon',name:'보름달',hell:'s05',trail:'#fff6d0'},
  {id:'h_sprout',name:'새싹',hell:'s06',trail:'#7ed957'},
  {id:'h_drop',name:'물방울',hell:'s07',trail:'#3fb2ff'},
  {id:'h_cactus',name:'선인장',hell:'s08',trail:'#6cc84a'},
  {id:'h_snowman',name:'눈사람',hell:'s09',trail:'#cfe8ff'},
  {id:'h_puffer',name:'복어',hell:'s10',trail:'#1aa6b0'}
];
const stIdx=id=>STAGES.findIndex(s=>s.id===id);

/* ───────── 저장 ───────── */
const SAVE_KEY='dodge_v2';
let S={coins:0,open:1,clear:{},hell:{},best:{},own:['basic'],skin:'basic',adm:{on:false}};
try{const o=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(o)S=Object.assign(S,o)}catch(e){}
S.opt=Object.assign({sens:1,shake:true,vib:true,trail:true,hq:true},S.opt||{});
const SENS=[{n:'느림',v:.85},{n:'보통',v:1.15},{n:'빠름',v:1.5}];
SKINS.forEach(k=>{if(k.hell&&S.hell[k.hell]&&!S.own.includes(k.id))S.own.push(k.id)});
const ADM_PW='spys2013777!';
const A=k=>!!(S.adm&&S.adm.on&&S.adm[k]);
const coinStr=()=>A('coin')?'∞':S.coins;
const owns=id=>S.own.includes(id)||A('skins');
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}

/* ───────── 그림: 이미지 파일 없이 전부 코드로 그림 (128칸 기준) ───────── */
const ART={};
let _sd=1;const sr=()=>(_sd=(_sd*16807)%2147483647)/2147483647;const seed=s=>{_sd=s};
function C(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');f(g,w,h);return c}
function rg(g,x,y,r,c0,c1,c2){const q=g.createRadialGradient(x-r*.35,y-r*.4,r*.05,x,y,r);q.addColorStop(0,c0);q.addColorStop(.55,c1);q.addColorStop(1,c2);return q}
function circ(g,x,y,r){g.beginPath();g.arc(x,y,r,0,Math.PI*2)}
function ink(g,w=5,c='#1c1a26'){g.lineWidth=w;g.strokeStyle=c;g.lineJoin='round';g.lineCap='round';g.stroke()}
function shine(g,x,y,rx,ry,a=.85){g.fillStyle='rgba(255,255,255,'+a+')';g.beginPath();g.ellipse(x,y,rx,ry,-.5,0,Math.PI*2);g.fill()}
function eyes(g,x,y,sep,er){for(const s of[-1,1]){const ex=x+s*sep;g.fillStyle='#1c1a26';g.beginPath();g.ellipse(ex,y,er,er*1.25,0,0,Math.PI*2);g.fill();
  g.fillStyle='#fff';circ(g,ex-er*.3,y-er*.45,er*.38);g.fill();circ(g,ex+er*.3,y+er*.4,er*.16);g.fill()}}
function blush(g,x,y,sep,r){g.fillStyle='rgba(255,120,150,.45)';for(const s of[-1,1]){g.beginPath();g.ellipse(x+s*sep,y,r,r*.55,0,0,Math.PI*2);g.fill()}}
function smile(g,x,y,w){g.beginPath();g.arc(x,y-w*.4,w,.25*Math.PI,.75*Math.PI);ink(g,3.5)}
function spr128(f,size=128){return C(size,size,(g,w)=>{g.scale(w/128,w/128);f(g)})}

const DRAW={

function makeArt(n){
  if(n==='proj_05_glitch')return C(256,32,g=>{const cs=['#00f0ff','#ff2bd6','#ffffff','#7a2bff'];seed(9);for(let x=0;x<256;x+=8){g.fillStyle=cs[(sr()*4)|0];g.fillRect(x,(sr()*10)|0,8+((sr()*10)|0),12+((sr()*10)|0))}});
  const f=DRAW[n];if(!f)return null;const big=n.startsWith('skin_')||n.startsWith('boss_'),shd=n.startsWith('skin_');
  // 바닥 그림자를 깔아 입체감
  return spr128(g=>{if(shd){g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.ellipse(64,120,34,6,0,0,Math.PI*2);g.fill()}g.save();g.translate(64,64);g.scale(.92,.92);g.translate(-64,-64);f(g);g.restore()},big?160:128);
}
function img(n){if(!(n in ART))ART[n]=makeArt(n);return ART[n]}

/* ───────── 공용 도우미 ───────── */
function wallBounce(e){if(e.hits>0){if(e.x<e.r&&e.vx<0||e.x>W-e.r&&e.vx>0){e.vx*=-1;e.hits--}if(e.y<e.r&&e.vy<0||e.y>H-e.r&&e.vy>0){e.vy*=-1;e.hits--}}}
function shot(x,y,a,v,o){const e=mk('b',Object.assign({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:9,im:'proj_01_line'},o));if(e.wave){e.bx=x;e.by=y}return e}
function radial(x,y,n,v,im,r){const o=rnd(0,TAU);for(let i=0;i<n;i++)shot(x,y,o+i/n*TAU,v,{im,r})}
function lob(x,y,tx,ty,fl,im,r,rr,land){return mk('lob',{x,y,sx:x,sy:y,tx,ty,fl,im,r,rr,land})}
function mark(x,y,r,w,im,land){return mk('mark',{x,y,r,warn:w,w0:w,act:.18,im,land})}
function hitC(e){const dx=e.x-P.x,dy=e.y-P.y,rr=e.r+P.r-3;return dx*dx+dy*dy<rr*rr}
function spr(n,x,y,s,rot,a){const im=img(n);cx.globalAlpha=a;
  if(im){if(rot){cx.save();cx.translate(x,y);cx.rotate(rot);cx.drawImage(im,-s/2,-s/2,s,s);cx.restore()}else cx.drawImage(im,x-s/2,y-s/2,s,s)}
  else{cx.fillStyle='#222';cx.beginPath();cx.arc(x,y,s/2.6,0,TAU);cx.fill()}cx.globalAlpha=1}
function ring(x,y,r,c,blink){cx.strokeStyle=c;cx.globalAlpha=blink?(((performance.now()/120)|0)%2?.85:.35):.8;cx.lineWidth=2.5;cx.setLineDash([7,6]);cx.beginPath();cx.arc(x,y,r,0,TAU);cx.stroke();cx.setLineDash([]);cx.globalAlpha=1}
function tele(x,y,tx,ty){cx.strokeStyle='rgba(232,50,43,.6)';cx.lineWidth=2;cx.setLineDash([6,6]);cx.beginPath();cx.moveTo(x,y);const a=Math.atan2(ty-y,tx-x);cx.lineTo(x+Math.cos(a)*900,y+Math.sin(a)*900);cx.stroke();cx.setLineDash([])}
function boom(x,y,c,n=14){for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(60,260);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.4,.8),c,s:rnd(3,6)})}shake=Math.max(shake,4)}
function sparkle(x,y,c){for(let i=0;i<8;i++){const a=rnd(0,TAU),v=rnd(40,120);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.4,c,s:3})}}

/* ───────── 보스와 양손 ───────── */
const bsc=()=>clamp(Math.min(W,H)/420,.8,1.35);
function bossInit(){G.B={x:W/2,y:-170,cast:0,flash:0};G.hands=[-1,1].map(side=>({side,x:W/2+side*90,y:-130,tx:W/2,ty:-130,hx:0,hy:0,pose:'open',ang:0,wind:0,busy:false}))}
function bossUpdate(dt){const B=G.B,Sc=bsc(),ty=Math.max(185,H*.21);
  B.x+=(W/2-B.x)*Math.min(1,dt*3);B.y+=(ty+Math.sin(G.t*1.6)*6-B.y)*Math.min(1,dt*3);B.cast=Math.max(0,B.cast-dt);B.flash=Math.max(0,B.flash-dt);
  for(const h of G.hands){h.hx=B.x+h.side*95*Sc;h.hy=B.y+30*Sc;
    if(!h.busy){h.tx=h.hx+Math.sin(G.t*2+h.side)*6;h.ty=h.hy+Math.cos(G.t*2.4+h.side)*8}
    const k=Math.min(1,dt*(h.busy?9:5));h.x+=(h.tx-h.x)*k;h.y+=(h.ty-h.y)*k;h.wind=Math.max(0,h.wind-dt);
    let ta=h.side*.35;if(h.pose==='point')ta=Math.atan2(P.y-h.y,P.x-h.x)+Math.PI/2;else if(h.pose==='fist')ta=0;
    let d=ta-h.ang;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;h.ang+=d*Math.min(1,dt*12)}}
function drawBoss(){const B=G.B,Sc=bsc(),sz=135*Sc*(1+B.cast*.25);
  cx.save();if(B.flash>0||B.cast>0){cx.shadowColor=RED;cx.shadowBlur=30}spr('boss_'+G.st.id,B.x,B.y,sz,Math.sin(G.t*1.3)*.05,1);cx.restore();
  const b=G.st.boss;for(const h of G.hands)drawHand(h,b.c1,b.c2)}
function drawHand(h,c1,c2){const s=22*bsc();let jx=0,jy=0;if(h.wind>0){jx=rnd(-2.5,2.5);jy=rnd(-2.5,2.5)}
  cx.save();cx.translate(h.x+jx,h.y+jy);cx.rotate(h.ang);if(h.side>0)cx.scale(-1,1);
  if(h.wind>0){cx.shadowColor=RED;cx.shadowBlur=24}
  cx.fillStyle=c1;cx.strokeStyle=c2;cx.lineWidth=3.5*bsc();cx.lineJoin='round';
  const fing=(x,y,len,a)=>{cx.save();cx.translate(x,y);cx.rotate(a);cx.beginPath();cx.roundRect(-s*.21,-len,s*.42,len+s*.2,s*.21);cx.fill();cx.stroke();cx.restore()};
  const palm=()=>{cx.beginPath();cx.roundRect(-s*.8,-s*.6,s*1.6,s*1.35,s*.55);cx.fill();cx.stroke()};
  if(h.pose==='fist'){cx.beginPath();cx.roundRect(-s*.9,-s*.75,s*1.8,s*1.5,s*.5);cx.fill();cx.stroke();cx.shadowBlur=0;cx.beginPath();for(const x of[-.45,0,.45]){cx.moveTo(x*s,-s*.75);cx.lineTo(x*s,-s*.3)}cx.stroke();fing(-s*.95,0,s*.5,-1.2)}
  else if(h.pose==='point'){fing(-s*.15,-s*.5,s*1.35,0);palm();cx.shadowBlur=0;fing(-s*.9,-s*.05,s*.6,-1.1)}
  else{for(const[x,a,l]of[[-.55,-.25,1.0],[-.18,-.08,1.15],[.2,.08,1.1],[.55,.25,.9]])fing(x*s,-s*.4,l*s,a);fing(-s*.85,s*.05,s*.75,-1.15);palm();cx.shadowBlur=0}
  cx.restore()}

function pickAtk(free){const fit=l=>l.filter(id=>ATK[id].h<=free&&!G.atks.some(a=>a.id===id)&&!(ATK[id].solo&&G.atks.length));const O=fit(G.own),Ol=fit(G.old);
  const list=(Ol.length&&(Math.random()<.35||!O.length))?Ol:O;return list.length?list[Math.random()*list.length|0]:null}
function runAtks(dt){
  const maxC=(G.lv>=5||G.hell)?2:1;
  G.cool-=dt;
  const soloOn=G.atks.some(a=>ATK[a.id].solo);
  if(G.cool<=0&&G.atks.length<maxC&&!soloOn){const free=G.hands.filter(h=>!h.busy),id=pickAtk(free.length);
    if(id){const a=ATK[id];const hs=a.h===2?G.hands.slice():a.h===1?[free[Math.random()*free.length|0]]:[];hs.forEach(h=>{h.busy=true;h.pose='open'});G.B.flash=.3;
      G.atks.push({id,hs,gen:a.run(hs),w:0});G.cool=G.atks.length<maxC?Math.max(.9,1.7-G.d*.6):0}
    else G.cool=.2}
  for(const a of G.atks){a.w-=dt;while(a.w<=0&&!a.done){const r=a.gen.next();if(r.done){a.done=1;break}a.w+=r.value||0}}
  const n=G.atks.length;
  for(const a of G.atks)if(a.done)a.hs.forEach(h=>{h.busy=false;h.pose='open';h.wind=0});
  G.atks=G.atks.filter(a=>!a.done);
  if(G.atks.length<n)G.cool=Math.max(G.cool,Math.max(.25,.85-G.d*.45)*(G.hell?.65:1)*(1+G.ez*.3));
}
function hurt(){

  P.hp--;P.inv=1.5;renderHp();shake=Math.max(shake,10);boom(P.x,P.y,RED,16);

function update(dt){
  G.t+=dt;const p=G.t/G.T;
  const scale=Math.min(W,H)/420*.45+.55;
  // 1스테이지는 느리게, 스테이지마다 조금씩 빨라짐
  G.sp=(195+G.si*18)*(1+p*.35)*(G.hell?1.15:1)*scale;
  G.d=clamp(.1+G.lv*.07+p*.18,0,1.1)+(G.hell?.2:0);
  while(G.newQ.length&&G.t>=G.nextAdd){const id=G.newQ.shift();G.own.push(id);if(G.t>.5)banner('새 공격!',ATK[id].n);G.nextAdd+=G.T/G.st.atks.length}
  if(bannerT>0){bannerT-=dt;if(bannerT<=0)$('banner').style.opacity=0}
  if(!G.cut&&G.ultAt.length&&G.t>=G.ultAt[0]){G.ultAt.shift();startUlt()}
  G.flashW=Math.max(0,(G.flashW||0)-dt);
  if(G.cut){bossUpdate(dt);cutUpdate(dt);P.inv=Math.max(0,P.inv-dt);return}
  bossUpdate(dt);runAtks(dt);
  G.coinT-=dt;if(G.coinT<=0){G.coinT=rnd(9,14);coinsOnField.push({...inner(50),life:6})}
  for(const c of coinsOnField){c.life-=dt;if(Math.hypot(c.x-P.x,c.y-P.y)<22){c.life=0;G.earn+=G.hell?10:5;sparkle(c.x,c.y,'#ffd23f')}}
  coinsOnField=coinsOnField.filter(c=>c.life>0);
  G.earn+=dt*(G.hell?2:1);
  P.slow=1;P.inv=Math.max(0,P.inv-dt);
  for(const e of foes){e.age+=dt;ENT[e.k].u(e,dt)}
  P.x=clamp(P.x,P.r,W-P.r);P.y=clamp(P.y,P.r,H-P.r);
  foes=foes.filter(e=>!e.dead);
  if(foes.length>600)foes.splice(0,foes.length-600);
  if(!window.__god&&!A('god')&&P.inv<=0)for(const e of foes){const h=ENT[e.k].h;if(h?h(e):hitC(e)){hurt();if(G.over)return;break}}
  const sk=SKINS.find(s=>s.id===S.skin);if(sk&&sk.trail&&S.opt.trail){P.trail.push({x:P.x,y:P.y,l:.35});}
  for(const t of P.trail)t.l-=dt;P.trail=P.trail.filter(t=>t.l>0);
  if(G.t>=G.T){G.t=G.T;end(true)}
}

function end(win){
